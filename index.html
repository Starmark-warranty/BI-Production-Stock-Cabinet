<!--
  StarStock — แอปไฟล์เดียว เปิดจากไฟล์ตรง ๆ หรือจากที่เดียวกับ StarNexus (github.io) ก็ได้
  ข้อมูลอยู่บน Google Drive (Apps Script ตัวเดียวกับ StarNexus / Production V2) · รายละเอียดรูปแบบไฟล์ดูหัว stock_app ข้างล่าง
  สร้างจาก build_stock.py (stock.css + gasfs.js + stock_app.js) — แก้ที่ไฟล์ต้นทางแล้ว build ใหม่
  v1.4 (2026-10-14): แก้ที่ไฟล์ HTML นี้ตรง ๆ (หน้า HOME + Lot ผลิต data 6) — ไฟล์ต้นทางชุดเดิมไม่ได้ตามมาด้วย
-->
<style>
  :root{
    --bg:#e7e8ee; --bg2:#f2f3f7; --solid:#ffffff; --card:#ffffff; --card2:#f7f8fa;
    --line:rgba(0,0,0,0.10); --line-strong:rgba(0,0,0,0.16);
    --ink:#1d1d1f; --ink-dim:#5f5f66; --ink-faint:#8a8a90;
    --accent:#1F3864; --accent-press:#16294a; --accent-soft:rgba(31,56,100,.12);
    --orange:#E8901F; --good:#1f8a4c; --warn:#b26a00; --bad:#c0392b;
    --radius:11px; --shadow:0 14px 40px -14px rgba(0,0,0,.28), 0 2px 8px -3px rgba(0,0,0,.12);
    --ctl-shadow:0 1px 2px rgba(0,0,0,.10), inset 0 0 0 .5px rgba(0,0,0,.06);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Sarabun","Segoe UI",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,"IBM Plex Mono",Menlo,Consolas,monospace;
    --row:48px;
  }
  body[data-theme="dim"]{ --bg:#c9ccd4; --bg2:#d8dae1; --solid:#eef0f4; --card:#eef0f4; --card2:#e6e8ee;
    --line:rgba(0,0,0,0.12); --line-strong:rgba(0,0,0,0.19); --ink:#1b1c20; --ink-dim:#565961; --ink-faint:#84878f; }
  body[data-theme="dark"]{ --bg:#14161c; --bg2:#1b1e26; --solid:#20232c; --card:#20232c; --card2:#1a1d25;
    --line:rgba(255,255,255,0.11); --line-strong:rgba(255,255,255,0.18); --ink:#e9eaee; --ink-dim:#a2a6b1; --ink-faint:#767a85;
    --accent:#4a72c4; --accent-press:#3b5da3; --accent-soft:rgba(74,114,196,.22); --good:#45c07a; --warn:#e0a03a; --bad:#ff6b5e;
    --ctl-shadow:0 1px 2px rgba(0,0,0,.45), inset 0 0 0 .5px rgba(255,255,255,.07); color-scheme:dark; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  .mono{font-family:var(--mono)}
  .hide{display:none!important}

  /* ── แถบบน ── */
  #top{height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--solid);border-bottom:.5px solid var(--line-strong)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;letter-spacing:.2px;white-space:nowrap}
  .brand svg{width:26px;height:26px;flex:none}
  .brand .ver{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-faint)}
  .sub{font-size:12px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sp{flex:1}
  .tbtn{display:inline-flex;align-items:center;gap:6px;background:var(--solid);border:.5px solid var(--line-strong);border-radius:8px;padding:6px 11px;font-size:12.5px;cursor:pointer;box-shadow:var(--ctl-shadow);white-space:nowrap}
  .tbtn:hover{background:var(--card2)}
  .tbtn.pri{background:var(--accent);color:#fff;border-color:transparent}
  .tbtn.pri:hover{background:var(--accent-press)}
  .tbtn.dangr{color:var(--bad)}
  .tbtn:disabled{opacity:.45;cursor:default}
  #fresh{font-size:11.5px;color:var(--ink-dim);background:var(--bg2);border-radius:20px;padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
  #fresh.warn{color:var(--warn)}
  #driveDot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);display:inline-block}
  #driveDot.on{background:var(--good)} #driveDot.bad{background:var(--bad)}

  /* ── โครง ── */
  #main{position:absolute;top:52px;left:0;right:0;bottom:0;display:flex}
  #side{width:270px;flex:none;overflow:auto;padding:12px;border-right:.5px solid var(--line-strong);background:var(--bg2)}
  #center{flex:1;min-width:0;display:flex;flex-direction:column}
  #detail{width:400px;flex:none;overflow:auto;border-left:.5px solid var(--line-strong);background:var(--solid);padding:14px 16px 30px}

  /* ── ตัวกรอง ── */
  .search{position:relative;margin-bottom:12px}
  .search input{width:100%;padding:9px 12px 9px 32px;border-radius:10px;border:.5px solid var(--line-strong);background:var(--solid);box-shadow:var(--ctl-shadow);font-size:14px}
  .search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-faint)}
  .fgrp{margin:0 0 14px}
  .fgrp h4{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-faint);margin:0 0 6px;display:flex;align-items:center;gap:6px}
  .fgrp h4 button{margin-left:auto;font-size:11px;border:0;background:none;color:var(--accent);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:600}
  .seg{display:flex;flex-wrap:wrap;gap:4px}
  .seg button{border:.5px solid var(--line-strong);background:var(--solid);border-radius:7px;padding:4px 9px;font-size:12px;cursor:pointer;color:var(--ink-dim)}
  .seg button.on{background:var(--accent);color:#fff;border-color:transparent}
  .flist{max-height:240px;overflow:auto;border-radius:9px;background:var(--solid);border:.5px solid var(--line)}
  .fitem{display:flex;align-items:center;gap:7px;padding:5px 9px;font-size:12.5px;cursor:pointer;border-bottom:.5px solid var(--line)}
  .fitem:last-child{border-bottom:0}
  .fitem:hover{background:var(--card2)}
  .fitem.on{background:var(--accent-soft);font-weight:700}
  .fitem .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fitem .c{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .sw{width:10px;height:10px;border-radius:3px;flex:none}

  /* ── แถบเหนือรายการ ── */
  #bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:.5px solid var(--line-strong);background:var(--solid);flex-wrap:wrap}
  #count{font-size:12.5px;color:var(--ink-dim)}
  #count b{color:var(--ink);font-size:14px}
  #bar select{border:.5px solid var(--line-strong);border-radius:7px;padding:4px 6px;background:var(--solid);font-size:12px}
  #bulk{display:flex;align-items:center;gap:6px;background:var(--accent-soft);border-radius:8px;padding:3px 6px 3px 10px;font-size:12px}
  #banner{margin:8px 12px 0;padding:8px 12px;border-radius:9px;background:rgba(232,144,31,.14);border:1px solid rgba(232,144,31,.35);font-size:12.5px;line-height:1.55}
  #banner b{color:var(--warn)}

  /* ── รายการ (เลื่อนแบบเสมือน: วาดเฉพาะแถวที่เห็น) ── */
  #listWrap{flex:1;overflow:auto;position:relative}
  #listSpacer{width:1px}
  #listRows{position:absolute;left:0;right:0;top:0}
  .hdr{position:sticky;top:0;z-index:2;display:grid;align-items:center;height:32px;background:var(--bg2);border-bottom:.5px solid var(--line-strong);font-size:11px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.3px}
  .hdr span{cursor:pointer;user-select:none;padding:0 6px;white-space:nowrap;overflow:hidden}
  .hdr span.sorted{color:var(--accent)}
  /* v1.1: รหัสยาว (AX 20+ ตัว) กับชื่อยาว เห็นไม่ครบ → ตัวหนังสือเล็กลง · คอลัมน์รหัสกว้างขึ้น · รหัส/ชื่อขึ้นบรรทัดที่ 2 ได้ */
  .gridcols{grid-template-columns:30px 40px minmax(150px,1.1fr) minmax(190px,2.6fr) minmax(80px,.9fr) 96px 108px minmax(100px,1fr) 92px}
  .row{position:absolute;left:0;right:0;height:var(--row);display:grid;align-items:center;border-bottom:.5px solid var(--line);background:var(--card);cursor:pointer;font-size:12px}
  .row:hover{background:var(--card2)}
  .row.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  .row > div{padding:0 6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row > .code{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:-.1px;line-height:1.25;white-space:normal;word-break:break-all;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .row > .nm{line-height:1.22;white-space:normal}
  .row .nm .n1{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px}
  .row .nm small{display:block;color:var(--ink-faint);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .num{text-align:right;font-family:var(--mono);font-size:12px}
  .row .num small{display:block;color:var(--ink-faint);font-size:10.5px;font-family:var(--font)}
  .ck{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
  .th{width:34px;height:34px;border-radius:7px;background:var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--ink-faint);font-size:11px;font-weight:700;flex:none}
  .th img{width:100%;height:100%;object-fit:cover;display:block}
  .chips{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:20px;background:var(--bg2);color:var(--ink-dim);white-space:nowrap;border:.5px solid var(--line);max-width:100%;overflow:hidden;text-overflow:ellipsis;flex:none}
  .chips .chip{flex:0 1 auto}
  .th svg{width:18px;height:18px;opacity:.55}
  .chip.ax{background:transparent}
  .chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
  .whb{display:inline-block;font-family:var(--mono);font-size:10.5px;background:var(--bg2);border-radius:5px;padding:1px 5px;margin-right:3px}
  .ok{color:var(--good)} .lo{color:var(--warn)} .neg{color:var(--bad)}
  .src{font-size:10px;color:var(--ink-faint)}
  .src.me{color:var(--orange);font-weight:700}

  /* ── มุมมองการ์ด ── */
  .card{position:absolute;border-radius:12px;background:var(--card);border:.5px solid var(--line);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
  .card:hover{box-shadow:var(--shadow)}
  .card.sel{outline:2px solid var(--accent)}
  .card .pic{height:140px;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:12px}
  .card .pic img{width:100%;height:100%;object-fit:cover}
  .card .bd{padding:8px 10px;font-size:12.5px;display:flex;flex-direction:column;gap:3px;min-height:0}
  .card .bd .code{font-family:var(--mono);font-weight:700;font-size:12px}
  .card .bd .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-dim)}
  .card .bd .ln{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px}

  /* ── รายละเอียด ── */
  #detail h2{font-family:var(--mono);font-size:17px;display:flex;align-items:center;gap:8px}
  #detail h2 button{margin-left:auto}
  #detail .nm1{font-size:15px;font-weight:700;margin:4px 0 2px;line-height:1.35}
  #detail .nm2{font-size:12.5px;color:var(--ink-dim)}
  .sec{margin-top:16px}
  .sec h3{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .sec h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
  .bigpic{position:relative;height:250px;border-radius:12px;background:var(--bg2);border:1.5px dashed var(--line-strong);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:12px;color:var(--ink-faint);font-size:12.5px;text-align:center;line-height:1.6}
  .bigpic.has{border-style:solid;border-color:var(--line)}
  .bigpic img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
  .bigpic.drag{border-color:var(--accent);background:var(--accent-soft)}
  .picbar{display:flex;gap:6px;margin-top:6px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px;align-items:center}
  .kv .k{color:var(--ink-dim);font-size:12px}
  .kv .v{font-family:var(--mono);text-align:right}
  .pin{display:flex;gap:6px;align-items:center;margin-top:8px}
  .pin input{flex:1;min-width:0;border:.5px solid var(--line-strong);border-radius:8px;padding:7px 10px;background:var(--solid);font-family:var(--mono);font-size:14px;font-weight:700;text-align:right}
  .pin input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .used{display:flex;align-items:baseline;gap:8px;padding:9px 11px;border-radius:10px;background:var(--accent-soft)}
  .used b{font-family:var(--mono);font-size:20px}
  table.st{width:100%;border-collapse:collapse;font-size:12.5px}
  table.st th{font-size:10.5px;color:var(--ink-faint);font-weight:700;text-align:right;padding:4px 5px;border-bottom:.5px solid var(--line-strong)}
  table.st th:first-child,table.st td:first-child{text-align:left}
  table.st td{padding:5px;border-bottom:.5px solid var(--line);font-family:var(--mono);text-align:right}
  table.st td:first-child{font-family:var(--font)}
  table.st td small{display:block;color:var(--ink-faint);font-size:10.5px;font-family:var(--font)}
  table.st tr.tot td{font-weight:700;border-bottom:0}
  .catpick{display:flex;flex-wrap:wrap;gap:5px}
  .catpick button{border:.5px solid var(--line-strong);background:var(--solid);border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .catpick button.on{color:#fff;border-color:transparent}
  textarea.note{width:100%;min-height:58px;border:.5px solid var(--line-strong);border-radius:8px;padding:7px 9px;background:var(--solid);resize:vertical;font-size:13px}
  .muted{color:var(--ink-faint);font-size:12px}
  .dem{padding:9px 11px;border-radius:10px;background:var(--bg2);font-size:13px;line-height:1.6}

  /* ── หน้าต่าง ── */
  #ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
  .box{background:var(--solid);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px 20px}
  .box h2{font-size:16px;margin-bottom:8px}
  .box p{font-size:13px;line-height:1.6;color:var(--ink-dim);margin:6px 0}
  .box input[type=text],.box input[type=password],.box textarea{width:100%;border:.5px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:var(--solid);margin:4px 0}
  .box textarea{min-height:160px;font-family:var(--mono);font-size:12.5px}
  .box .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
  .box .msg{font-size:12.5px;margin-top:6px;min-height:18px}
  .catrow{display:flex;gap:6px;align-items:center;margin:4px 0}
  .catrow input[type=color]{width:34px;height:30px;border:0;background:none;padding:0}
  .catrow input[type=text]{flex:1;margin:0}
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:95;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
  #lb img{max-width:96vw;max-height:94vh;object-fit:contain}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw}
  #toast.on{opacity:.94}
  #load{position:fixed;inset:52px 0 0 0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--bg);z-index:50;font-size:13.5px;color:var(--ink-dim)}
  #load .spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line-strong);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #fbtn{display:none}
  /* เปิดรายละเอียดอยู่ (จอกว้าง): ช่องกลางแคบลง → ซ่อนคอลัมน์ Warehouse (ดูในรายละเอียดแทน) */
  body.detOpen .gridcols{grid-template-columns:30px 40px minmax(150px,1.2fr) minmax(170px,2.4fr) minmax(76px,.8fr) 90px 104px 92px}
  body.detOpen .c-wh{display:none!important}
  @media (max-width: 1460px){
    body.detOpen .gridcols{grid-template-columns:30px 40px minmax(150px,1.1fr) minmax(150px,2fr) 88px 100px 90px}
    body.detOpen .c-cat{display:none!important}
  }

  /* ── จอแคบ (มือถือ/แท็บเล็ต) ── */
  @media (max-width: 1320px){
    #detail{position:fixed;inset:52px 0 0 auto;width:min(420px,100vw);z-index:40;box-shadow:var(--shadow)}
    body.detOpen .gridcols{grid-template-columns:30px 40px minmax(150px,1.1fr) minmax(190px,2.6fr) minmax(80px,.9fr) 96px 108px minmax(100px,1fr) 92px}
    body.detOpen .c-wh,body.detOpen .c-cat{display:block!important}
  }
  @media (max-width: 1160px){
    .gridcols,body.detOpen .gridcols{grid-template-columns:30px 40px minmax(140px,1fr) minmax(150px,2fr) 92px 104px 92px}
    .c-wh,body.detOpen .c-wh,body.detOpen .c-cat{display:none!important}
    .c-cat{display:none!important}
  }
  @media (max-width: 980px){
    .sub,#fresh{display:none}
    .gridcols,body.detOpen .gridcols{grid-template-columns:30px 40px minmax(120px,1fr) minmax(120px,1.6fr) 84px 96px}
    .c-dem,body.detOpen .c-dem{display:none!important}
  }
  @media (max-width: 760px){
    #side{position:fixed;inset:52px auto 0 0;z-index:41;width:min(300px,86vw);box-shadow:var(--shadow);transform:translateX(-105%);transition:transform .2s}
    body.sideOpen #side{transform:none}
    #fbtn{display:inline-flex}
    .gridcols,body.detOpen .gridcols{grid-template-columns:40px 104px minmax(0,1fr) 72px 76px}
    .c-cat,.c-wh,.c-dem,.c-ck,body.detOpen .c-cat{display:none!important}
    #top .tbtn .lbl,.brand .ver,#btnPaste,#btnUser,#btnExport{display:none}
    #top{gap:6px;padding:0 8px}
  }
  @media (max-width: 520px){ .brand .bname{display:none} }
  /* v1.1: ที่มาของยอดต้องใช้ */
  .fnote{font-size:11px;color:var(--ink-dim);margin:-2px 0 6px;line-height:1.4}
  .fnote.warn{color:var(--warn)}
  .fgrp h4 .tip{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--bg2);color:var(--ink-dim);font-size:10px;cursor:help;margin-left:4px}
  .demsrc{font-size:11px;line-height:1.5;margin-top:6px}

  /* ═════════ v1.4: หน้า HOME · Lot ผลิต (data 6) ═════════
     เดิม: เปิดมาเจอคลังสินค้า (STOCK) ทันที มีหน้าเดียว
     ตอนนี้: เปิดมาที่ HOME เลือกเข้า STOCK หรือ Lot ผลิต · body[data-view] = home | stock | lots (จำใน #hash ของลิงก์) */
  :root{ --s0:#c0392b; --s1:#d97706; --s2:#1971c2; --s3:#1f8a4c; }
  body[data-theme="dark"]{ --s0:#ff6b5e; --s1:#f0a33a; --s2:#5c9ded; --s3:#45c07a; }
  body:not([data-view="stock"]) .stockOnly,
  body:not([data-view="lots"]) .lotsOnly,
  body:not([data-view="stock"]) #main,
  body:not([data-view="stock"]) #load,
  body:not([data-view="home"]) #home,
  body:not([data-view="lots"]) #lots,
  body[data-view="home"] #fbtn{display:none!important}
  .vtag{font-size:12px;font-weight:700;color:var(--ink-dim);background:var(--bg2);border-radius:7px;padding:3px 9px;white-space:nowrap}
  .brand{cursor:pointer}
  .brand svg{display:block}

  /* ── HOME: แบบหน้า Welcome ของ “ส่งตั้ง Code AX” (ผู้ใช้ 14:29: หน้าทางเข้าเอาแบบ HTML นี้ · ใส่โลโก้ Starmark · ดูวันที่ Week) ──
     พื้นไล่สี · โลโก้ + ชื่อ + คำอธิบาย · การ์ด 2 ใบ (ไอคอนมน 48 · ชื่อสี · คำอธิบาย) · นาฬิกา/วันที่/สัปดาห์ มุมขวาบน
     ปุ่มตั้งค่ามุมซ้ายบน · ปุ่มธีมกลมมุมขวาล่าง · หน้า HOME ไม่มีแถบบน */
  :root{ --welcome-bg:linear-gradient(160deg,#e8eaf6 0%,#f0f0f5 40%,#e8f4fd 100%); --rc-bg:rgba(255,255,255,.82);
    --ic-stock:linear-gradient(145deg,#fff4e0,#ffe8c0); --ic-lot:linear-gradient(145deg,#e3f0ff,#d0e8ff); --c-stock:#e08600; --c-lot:#007aff; }
  body[data-theme="dim"]{ --welcome-bg:linear-gradient(160deg,#c4c8d6 0%,#c9ccd4 40%,#c2cdda 100%); --rc-bg:rgba(238,240,244,.88); }
  body[data-theme="dark"]{ --welcome-bg:linear-gradient(160deg,#15151f 0%,#0e0e11 40%,#0c1520 100%); --rc-bg:rgba(32,35,44,.82);
    --ic-stock:linear-gradient(145deg,#4a3413,#332208); --ic-lot:linear-gradient(145deg,#123055,#0d2440); --c-stock:#ff9f0a; --c-lot:#0a84ff; }
  body[data-view="home"] #top{display:none!important}
  #home{position:absolute;inset:0;overflow:auto;background:var(--welcome-bg);display:flex}
  .wwrap{display:flex;flex-direction:column;align-items:center;gap:28px;padding:76px 20px 56px;max-width:540px;width:100%;margin:auto}
  .wbrand{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
  .smlogo{display:block;width:240px;max-width:72vw;height:auto}
  .wtitle{font-size:26px;font-weight:700;letter-spacing:-.03em;display:flex;align-items:baseline;gap:8px}
  .wtitle .ver{font-family:var(--mono);font-size:12px;color:var(--ink-faint);font-weight:600;letter-spacing:0}
  .wsub{font-size:14px;color:var(--ink-dim);line-height:1.6}
  .rcards{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
  .rcard{position:relative;overflow:hidden;background:var(--rc-bg);border:1px solid var(--line);border-radius:16px;padding:22px 14px 14px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;color:var(--ink);font:inherit;
    box-shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:all .18s ease}
  .rcard::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .2s;pointer-events:none}
  .rcard.st::before{background:linear-gradient(160deg,rgba(255,149,0,.07),transparent)}
  .rcard.lt::before{background:linear-gradient(160deg,rgba(0,122,255,.07),transparent)}
  .rcard:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.10),0 1px 4px rgba(0,0,0,.06)}
  .rcard:hover::before{opacity:1}
  .rcard.st:hover{border-color:rgba(255,149,0,.35)} .rcard.lt:hover{border-color:rgba(0,122,255,.35)}
  .rcard:active{transform:none}
  .rcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ricon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
  .rcard.st .ricon{background:var(--ic-stock)} .rcard.lt .ricon{background:var(--ic-lot)}
  .rlabel{font-size:16px;font-weight:700} .rcard.st .rlabel{color:var(--c-stock)} .rcard.lt .rlabel{color:var(--c-lot)}
  .rdesc{font-size:12px;color:var(--ink-dim);line-height:1.5}
  .rstat{width:100%;border-top:1px solid var(--line);padding-top:10px;margin-top:2px;font-size:11.5px;color:var(--ink-dim);line-height:1.5;display:flex;flex-direction:column;gap:6px;align-items:stretch}
  .rstat .ln{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 10px}
  .rstat b{font-family:var(--mono);color:var(--ink);font-size:12.5px}
  .rstat .neg b{color:var(--bad)} .rstat .lo b{color:var(--warn)}
  .rstat .sbar{height:7px}
  .rkey{position:absolute;top:9px;right:10px;font-family:var(--mono);font-size:10px;color:var(--ink-faint);border:1px solid var(--line);border-radius:5px;padding:0 5px}
  .wstatus{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-dim);flex-wrap:wrap;justify-content:center;text-align:center;margin-top:-8px;line-height:1.5}
  .wnote{font-size:11px;color:var(--ink-faint);text-align:center;line-height:1.6;margin-top:-14px}
  #wClock{position:fixed;top:14px;right:18px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;line-height:1.3;pointer-events:none}
  #wClock .t{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  #wClock .d{font-size:11px;color:var(--ink-dim);font-weight:500;white-space:nowrap}
  #wClock .w{font-size:10px;color:var(--ink-faint);pointer-events:auto}
  #wTools{position:fixed;top:14px;left:18px;z-index:60;display:flex;gap:6px}
  #wTools button,#wTheme{background:var(--rc-bg);border:1px solid var(--line-strong);cursor:pointer;color:var(--ink);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  #wTools button{height:32px;min-width:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 9px;font-size:12px}
  #wTheme{position:fixed;right:18px;bottom:18px;z-index:60;width:42px;height:42px;border-radius:50%;font-size:17px;box-shadow:0 4px 20px rgba(0,0,0,.10)}
  @media (max-width: 380px){ .rcards{grid-template-columns:1fr} }
  @media (max-width: 520px){ #wTools .lbl{display:none} }
  /* โลโก้ Starmark บนแถบบน · ธีมมืดใช้ภาพตัวหนังสือขาว (ไฟล์เดิมเป็น PNG พื้นขาวทึบ → ถอดพื้นออกแล้ว ไม่ต้องใช้ multiply) */
  .tlogo{height:19px;width:auto;display:block;flex:none}
  .smlogo.dk,.tlogo.dk{display:none}
  body[data-theme="dark"] .smlogo.lt,body[data-theme="dark"] .tlogo.lt{display:none}
  body[data-theme="dark"] .smlogo.dk,body[data-theme="dark"] .tlogo.dk{display:block}
  .tsep{width:1px;height:22px;background:var(--line-strong);flex:none}
  /* นาฬิกา · วันที่ · สัปดาห์ บนแถบบน (STOCK / Lot) */
  .tclock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;white-space:nowrap;padding:0 4px}
  .tclock .t{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .tclock .d{font-size:10.5px;color:var(--ink-dim)}
  @media (max-width: 1160px){ .tlogo,.tsep{display:none!important} }
  @media (max-width: 760px){ .tclock{display:none} }
  .row .cw{color:var(--accent);font-weight:800}
  body[data-theme="dark"] .row .cw{color:var(--s2)}

  @keyframes livep{0%{box-shadow:0 0 0 0 rgba(31,138,76,.45)}70%{box-shadow:0 0 0 7px rgba(31,138,76,0)}100%{box-shadow:0 0 0 0 rgba(31,138,76,0)}}

  /* ── Lot ผลิต (data 6) ── */
  #lots{position:absolute;top:52px;left:0;right:0;bottom:0;display:flex}
  #lotSide{width:256px;flex:none;overflow:auto;padding:12px;border-right:.5px solid var(--line-strong);background:var(--bg2)}
  #lotCenter{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
  #lotDetail{width:380px;flex:none;overflow:auto;border-left:.5px solid var(--line-strong);background:var(--solid);padding:14px 16px 30px}
  #lotBar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:.5px solid var(--line-strong);background:var(--solid);flex-wrap:wrap}
  #lotBar select{border:.5px solid var(--line-strong);border-radius:7px;padding:4px 6px;background:var(--solid);font-size:12px}
  #lotCount{font-size:12.5px;color:var(--ink-dim)} #lotCount b{color:var(--ink);font-size:14px}
  #lotLive{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-dim);white-space:nowrap}
  #lotBanner{margin:8px 12px 0;padding:8px 12px;border-radius:9px;font-size:12.5px;line-height:1.55;background:var(--accent-soft);border:1px solid var(--line)}
  #lotBanner.warn{background:rgba(232,144,31,.14);border-color:rgba(232,144,31,.35)}
  #lotBanner b{color:var(--ink)}
  #lotWrap{flex:1;overflow:auto;position:relative}
  #lotSpacer{width:1px}
  #lotRows{position:absolute;left:0;right:0;top:0}
  #lotFresh{font-size:11.5px;color:var(--ink-dim);background:var(--bg2);border-radius:20px;padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:440px}
  #lotFresh.warn{color:var(--warn)}
  .lcols{grid-template-columns:minmax(132px,1.05fr) minmax(200px,2.5fr) 92px 60px 60px 78px 44px 78px 114px 76px 58px 96px 118px}
  .row.lcols{height:44px}
  .row.lcols > .code{font-size:11.5px}
  .seg button .c{font-family:var(--mono);font-size:10.5px;opacity:.7;margin-left:3px}
  .seg button.on .c{opacity:.9}
  .stg{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px 2px 7px;border-radius:20px;white-space:nowrap;
    color:var(--sc,var(--ink-dim));background:color-mix(in srgb,var(--sc,var(--ink-faint)) 14%,transparent)}
  .stg i{width:7px;height:7px;border-radius:50%;background:var(--sc,var(--ink-faint));display:inline-block}
  .stg.s0{--sc:var(--s0)} .stg.s1{--sc:var(--s1)} .stg.s2{--sc:var(--s2)} .stg.s3{--sc:var(--s3)}
  .row .late{color:var(--bad);font-weight:700} .row .soon{color:var(--warn);font-weight:700}
  .row .dt{font-family:var(--mono);font-size:11.5px}
  .row .dt small{display:block;font-size:10px;color:var(--ink-faint);font-family:var(--font);font-weight:400}
  .row .rq{font-size:10.5px;line-height:1.35;font-family:var(--mono)}
  .nb{display:inline-block;font-family:var(--font);font-size:9.5px;font-weight:800;padding:0 5px;border-radius:4px;margin-left:5px;vertical-align:1px;color:#fff;letter-spacing:0}
  .nb.new{background:var(--good)} .nb.chg{background:var(--orange)}
  .row.flash{animation:lflash 2.6s ease-out 1}
  @keyframes lflash{0%{background:rgba(232,144,31,.42)}100%{background:var(--card)}}
  .m-only{display:none!important}
  #lotDrop{position:absolute;inset:8px;border:2px dashed var(--accent);border-radius:14px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;color:var(--accent);z-index:30;pointer-events:none;text-align:center;padding:20px}
  .lempty{max-width:560px;margin:56px auto;padding:26px 24px;text-align:center;border:1.5px dashed var(--line-strong);border-radius:16px;background:var(--card);font-size:13px;line-height:1.7;color:var(--ink-dim)}
  .lempty h3{font-size:16px;color:var(--ink);margin-bottom:6px}
  .lempty .tbtn{margin-top:12px}
  #lotDetail h2{font-family:var(--mono);font-size:16px;display:flex;align-items:center;gap:8px;word-break:break-all}
  #lotDetail h2 button{margin-left:auto;flex:none}
  #lotDetail .nm1{font-size:14.5px;font-weight:700;margin:6px 0 8px;line-height:1.45}
  .hist{font-size:12px;line-height:1.55;border-left:3px solid var(--orange);padding:4px 0 4px 10px;margin:6px 0}
  .hist .t{color:var(--ink-faint);font-size:11px}
  .hist s{color:var(--ink-faint)}
  details.raw{margin-top:14px;font-size:12px}
  details.raw summary{cursor:pointer;color:var(--ink-dim);font-weight:600}
  details.raw .kv{margin-top:6px}
  @media (max-width: 1500px){
    .lcols{grid-template-columns:minmax(132px,1.05fr) minmax(200px,2.5fr) 92px 60px 60px 78px 78px 114px 76px 58px 96px}

  }
  @media (max-width: 1320px){
    #lotDetail{position:fixed;inset:52px 0 0 auto;width:min(420px,100vw);z-index:40;box-shadow:var(--shadow)}

  }

  /* เปิดรายละเอียด Lot บนจอกว้าง: ช่องกลางแคบลง → ซ่อนคอลัมน์รอง (ดูในรายละเอียดแทน) */
  @media (min-width: 1701px){

  }
  @media (min-width: 1321px) and (max-width: 1700px){

    body.lotDet .c-rq,body.lotDet .c-wk,body.lotDet .c-pl,body.lotDet .c-cr,body.lotDet .c-sh{display:none!important}
  }


  /* ═════════ v1.5: คิวตัดงาน (แบบจอครัว KFC) — body[data-view="board"] ═════════ */
  body:not([data-view="board"]) #board,
  body:not([data-view="board"]) .boardOnly{display:none!important}
  body[data-view="board"] #fbtn{display:none!important}
  .wwrap{max-width:820px}
  .rcards{grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}
  .rcard.bq::before{background:linear-gradient(160deg,rgba(52,199,89,.08),transparent)}
  .rcard.bq:hover{border-color:rgba(52,199,89,.4)}
  .rcard.bq .ricon{background:var(--ic-board)} .rcard.bq .rlabel{color:var(--c-board)}
  :root{ --ic-board:linear-gradient(145deg,#e0ffe8,#c8f7d4); --c-board:#1f8a4c; }
  body[data-theme="dark"]{ --ic-board:linear-gradient(145deg,#17402a,#0f3020); --c-board:#45c07a; }
  #board{position:absolute;top:52px;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:var(--bg)}
  #bdBar{display:flex;align-items:center;gap:10px 16px;padding:9px 14px;border-bottom:.5px solid var(--line-strong);background:var(--solid);flex-wrap:wrap}
  #bdBar .day{font-size:15px;font-weight:800;white-space:nowrap}
  #bdBar .day small{display:block;font-size:11px;font-weight:500;color:var(--ink-dim)}
  .cap{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-dim);min-width:170px}
  .cap b{color:var(--ink);font-family:var(--mono)}
  .cap .cb{height:8px;border-radius:5px;background:var(--bg2);overflow:hidden;display:flex}
  .cap .cb i{display:block;height:100%;background:var(--s2)}
  .cap.over .cb i{background:var(--bad)}
  #bdBanner{margin:8px 14px 0;padding:8px 12px;border-radius:9px;font-size:12.5px;line-height:1.55;background:var(--accent-soft);border:1px solid var(--line)}
  #bdBanner.warn{background:rgba(232,144,31,.14);border-color:rgba(232,144,31,.35)}
  #bdCols{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:10px;padding:10px 14px 14px;overflow-x:auto}
  .bcol{display:flex;flex-direction:column;min-height:0;background:var(--bg2);border-radius:12px;border:.5px solid var(--line)}
  .bcol > h3{display:flex;align-items:baseline;gap:8px;padding:10px 12px 8px;font-size:13.5px;font-weight:800;border-bottom:.5px solid var(--line)}
  .bcol > h3 .n{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-dim)}
  .bcol > h3 small{display:block;font-size:11px;font-weight:500;color:var(--ink-faint);margin-top:1px}
  .bcol > h3 i.dot{width:9px;height:9px;border-radius:50%;flex:none;align-self:center}
  .blist{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
  .bmore{font-size:12px;color:var(--ink-dim);text-align:center;padding:6px}
  .bsep{font-size:11px;font-weight:700;color:var(--ink-faint);text-align:center;padding:2px 0;border-top:1px dashed var(--line-strong);margin-top:2px}
  .bcard{background:var(--card);border:.5px solid var(--line-strong);border-left:5px solid var(--ink-faint);border-radius:10px;padding:8px 10px 9px;cursor:pointer;font-size:12px;line-height:1.45;display:flex;flex-direction:column;gap:3px}
  .bcard:hover{box-shadow:var(--shadow)}
  .bcard.sel{outline:2px solid var(--accent);outline-offset:1px}
  .bcard.u-red{border-left-color:var(--bad)} .bcard.u-amb{border-left-color:var(--orange)} .bcard.u-grn{border-left-color:var(--good)}
  .bcard .bh{display:flex;align-items:baseline;gap:6px}
  .bcard .bq{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--ink-faint)}
  .bcard .bid{font-family:var(--mono);font-weight:800;font-size:12.5px;word-break:break-all;flex:1;min-width:0}
  .bcard .bdd{font-family:var(--mono);font-weight:800;font-size:12px;white-space:nowrap}
  .bcard .bdd.red{color:var(--bad)} .bcard .bdd.amb{color:var(--warn)}
  .bcard .brm{color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bcard .bm{color:var(--ink-dim);font-size:11.5px}
  .bcard .bm b{color:var(--ink);font-family:var(--mono);font-weight:700}
  .bpill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bpill.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
  .bpill.short{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
  .bpill.unk{background:var(--bg2);color:var(--ink-dim);border:.5px dashed var(--line-strong)}
  .bprog{height:6px;border-radius:4px;background:var(--bg2);overflow:hidden;margin-top:3px;display:flex}
  .bprog i{display:block;height:100%;background:var(--s2)}
  #bdDetail{position:absolute;top:0;right:0;bottom:0;width:min(440px,100vw);overflow:auto;background:var(--solid);border-left:.5px solid var(--line-strong);box-shadow:var(--shadow);padding:14px 16px 30px;z-index:35}
  #bdDetail h2{font-family:var(--mono);font-size:16px;display:flex;align-items:center;gap:8px;word-break:break-all}
  #bdDetail h2 button{margin-left:auto;flex:none}
  #bdDetail .nm1{font-size:14.5px;font-weight:700;margin:6px 0 8px;line-height:1.45}
  table.rmt{width:100%;border-collapse:collapse;font-size:12px}
  table.rmt th{font-size:10.5px;color:var(--ink-faint);font-weight:700;text-align:right;padding:4px 5px;border-bottom:.5px solid var(--line-strong)}
  table.rmt th:first-child,table.rmt td:first-child{text-align:left}
  table.rmt td{padding:5px;border-bottom:.5px solid var(--line);font-family:var(--mono);text-align:right;vertical-align:top}
  table.rmt td:first-child{font-family:var(--font)}
  table.rmt td small{display:block;color:var(--ink-faint);font-size:10.5px;font-family:var(--font)}
  .bset label{display:flex;align-items:center;gap:8px;font-size:13px;margin:7px 0}
  .bset label span{flex:1;color:var(--ink-dim)}
  .bset input[type=number]{width:96px;border:.5px solid var(--line-strong);border-radius:7px;padding:5px 8px;background:var(--solid);font-family:var(--mono);text-align:right}
  .bset .wd{display:flex;gap:4px;flex-wrap:wrap}
  .bset .wd label{margin:0;gap:3px;font-size:12px;border:.5px solid var(--line-strong);border-radius:7px;padding:3px 7px}
  .bset h4{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--ink-faint);margin:14px 0 2px;text-transform:uppercase}
  /* จอทีวี: ไม่มีแถบบน ตัวใหญ่ */
  body.tv #top{display:none!important}
  body.tv #board{top:0}
  body.tv .bcard{font-size:14px} body.tv .bcard .bid{font-size:15px} body.tv .bcard .bdd{font-size:14px} body.tv .bcard .bm{font-size:13px}
  body.tv .bcol > h3{font-size:16px} body.tv #bdBar .day{font-size:18px}
  #bdClock{display:none;flex-direction:column;align-items:flex-end;line-height:1.2;margin-left:auto}
  #bdClock .t{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  #bdClock .d{font-size:11.5px;color:var(--ink-dim)}
  body.tv #bdClock{display:flex}
  @media (max-width: 760px){
    #bdCols{grid-template-columns:repeat(5,minmax(78vw,1fr));scroll-snap-type:x mandatory}
    .bcol{scroll-snap-align:start}
    .cap{min-width:130px}
  }

  /* ═════════ v1.6: คิวตัดงาน 6 ช่อง + สถานะจริง (Smart Production · Cut Rite · วัตถุดิบราย Lot) ═════════ */
  :root{ --c-aft:#8e5bd8 }
  body[data-theme="dark"]{ --c-aft:#b38cf0 }
  #bdCols{grid-template-columns:repeat(6,minmax(214px,1fr))}
  .cap small{font-size:10.5px;color:var(--ink-faint);font-family:var(--font)}
  #bdBanner{display:flex;flex-wrap:wrap;gap:3px 16px;font-size:12px;line-height:1.5}
  #bdBanner .src b{font-family:var(--mono)}
  #bdBanner .src.ok{color:var(--ink)}
  #bdBanner .src.no{color:var(--bad);font-weight:600}
  #bdBanner .src.off{color:var(--ink-dim)}
  .bcard .bpd{font-size:11px;color:var(--warn);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bpill.warn{background:rgba(232,144,31,.16);color:var(--warn)}
  .bsteps{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
  .bsteps span{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:10px;background:var(--bg2);color:var(--ink-dim);border:.5px solid var(--line);white-space:nowrap}
  .bsteps span.ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good);border-color:transparent}
  .bsteps span.cur{background:color-mix(in srgb,var(--c-aft) 16%,transparent);color:var(--c-aft);border-color:transparent}
  #bdDetail .kv .ok{color:var(--good)}
  .bset select{border:.5px solid var(--line-strong);border-radius:7px;padding:5px 8px;background:var(--solid);color:var(--ink);font-size:12.5px;max-width:240px}
  body.tv .bsteps span{font-size:12px}
  body.tv .bcard .bpd{font-size:12.5px}
  @media (max-width: 760px){
    #bdCols{grid-template-columns:repeat(6,minmax(78vw,1fr))}
  }

  /* ═════════ v1.7: แถบเครื่องตัด (วันนี้ยิงจริง · พรุ่งนี้ตามแผน) ═════════ */
  #bdMc{display:flex;gap:6px;padding:7px 14px 0;overflow-x:auto;flex:none}
  #bdMc.hide{display:none}
  .mcc{flex:0 0 auto;min-width:150px;max-width:220px;background:var(--solid);border:.5px solid var(--line-strong);border-radius:10px;padding:5px 9px;font-size:11.5px;line-height:1.4}
  .mcc .mh{display:flex;align-items:center;gap:6px}
  .mcc .mh b{font-size:12px}
  .mcc .mh span{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--ink)}
  .mcc .mh i{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex:none}
  .mcc.on .mh i{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 20%,transparent)}
  .mcc.idle .mh i{background:var(--orange)}
  .mcc.off{opacity:.6;border-style:dashed}
  .mcc .ml{color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:11px}
  .mcc .mp{color:var(--accent);font-weight:700;font-size:11px}
  .bcard .bmc{color:var(--accent)}
  .bcard .bmc b{color:var(--accent);font-family:var(--font)}
  .bset .mcset label{margin:4px 0}
  .bset .mcset small{font-size:10.5px}
  body.tv .mcc{font-size:13px;min-width:180px} body.tv .mcc .mh b{font-size:14px} body.tv .mcc .ml{font-size:12.5px}
  .nw{white-space:nowrap}   /* v1.7.1 เวลา “2 ชม. 15 นาที” ไม่ตัดบรรทัดกลางคำ */
  /* v1.8 วัตถุดิบราย Lot ↔ Lot ที่จองใช้ */
  a.rmc{color:inherit;font-family:var(--mono);text-decoration:underline dotted var(--ink-faint);text-underline-offset:3px;cursor:pointer;word-break:break-all}
  a.rmc:hover{color:var(--accent);text-decoration-color:var(--accent)}
  .rmsum{font-size:12.5px;margin:0 0 6px;line-height:1.65}
  .rmgrp{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px}
  .rmgrp span{font-size:11px;border:.5px solid var(--line-strong);border-radius:999px;padding:1px 8px;color:var(--ink-dim)}
  table.rmt tr.gh td{font-family:var(--font);font-size:10.5px;font-weight:700;color:var(--ink-faint);letter-spacing:.3px;padding-top:10px;text-align:left;border-bottom:.5px solid var(--line-strong)}
  table.rmt tr.short td:first-child,table.rmt tr.part td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
  table.rmt tr.part td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
  table.rmt td.ok{color:var(--good)} table.rmt td.neg{color:var(--bad)} table.rmt td.muted{color:var(--ink-faint)}
  table.rmt td small .stg{font-size:10px;padding:1px 6px 1px 5px;margin-right:2px}
  details.rmdone{margin-top:8px}
  details.rmdone summary{cursor:pointer;font-size:12px;color:var(--ink-dim);padding:3px 0}
  .rmnote{font-size:11px;margin-top:6px;line-height:1.5}

  /* ═════════ v1.17 HOME: ปุ่มแบบมีมิติ (ผู้ใช้ 16/10 “ให้ดูมีมิติหน้ากดปุ่ม”) + ช่องที่ 4 Stock Cabinet ═════════
     เดิม: การ์ดแบนโปร่งแสง ลอยขึ้น 2px ตอนชี้ · ตอนนี้: ปุ่มมีความหนา (ฐานสีของแต่ละหมวดใต้ปุ่ม) กดแล้วยุบลงจริง
     สีหมวด: STOCK ส้ม · Lot ผลิต ฟ้า · คิวตัดงาน เขียว · Stock Cabinet สีไม้ */
  #wCards .rcard{ --tint:#5f5f66; --slab:#d5d8e0; --glow:rgba(30,40,60,.18); --lift:7px;
    --cap-top:#ffffff; --cap-bot:#f3f4f8; --cap-rim:rgba(255,255,255,.9); --cap-hi:#ffffff;
    background:linear-gradient(180deg,var(--cap-top) 0%,var(--cap-bot) 100%); border:1px solid var(--cap-rim); border-radius:22px;
    padding:28px 16px 18px; gap:10px; margin-bottom:9px; backdrop-filter:none; -webkit-backdrop-filter:none;
    box-shadow:inset 0 1.5px 0 var(--cap-hi), inset 0 -1px 0 rgba(0,0,0,.04), 0 var(--lift) 0 0 var(--slab),
      0 calc(var(--lift) + 14px) 26px -12px var(--glow), 0 2px 3px rgba(20,24,40,.06);
    transform:translateY(0); transition:transform .16s cubic-bezier(.2,.8,.3,1), box-shadow .16s cubic-bezier(.2,.8,.3,1); }
  #wCards .rcard::before{display:none}
  #wCards .rcard.st{ --tint:#c97800; --slab:#efc78c; --glow:rgba(224,134,0,.34); }
  #wCards .rcard.lt{ --tint:#0a6fe0; --slab:#b1d2f8; --glow:rgba(0,122,255,.28); }
  #wCards .rcard.bq{ --tint:#1f8a4c; --slab:#aadbbd; --glow:rgba(31,138,76,.28); }
  #wCards .rcard.cb{ --tint:#8a5528; --slab:#dec0a0; --glow:rgba(138,85,40,.32); }
  body[data-theme="dim"] #wCards .rcard{ --cap-top:#f4f5f8; --cap-bot:#e6e8ee; --cap-hi:rgba(255,255,255,.85); }
  body[data-theme="dim"] #wCards .rcard.st{ --slab:#d9ab66; } body[data-theme="dim"] #wCards .rcard.lt{ --slab:#8fb6e6; }
  body[data-theme="dim"] #wCards .rcard.bq{ --slab:#86c49f; } body[data-theme="dim"] #wCards .rcard.cb{ --slab:#c49d76; }
  body[data-theme="dark"] #wCards .rcard{ --cap-top:#2c303b; --cap-bot:#23262f; --cap-rim:rgba(255,255,255,.08); --cap-hi:rgba(255,255,255,.10); --glow:rgba(0,0,0,.55); }
  body[data-theme="dark"] #wCards .rcard.st{ --tint:#ffa62b; --slab:#6b4612; } body[data-theme="dark"] #wCards .rcard.lt{ --tint:#4ea1ff; --slab:#163f73; }
  body[data-theme="dark"] #wCards .rcard.bq{ --tint:#4cc681; --slab:#17512f; } body[data-theme="dark"] #wCards .rcard.cb{ --tint:#d99a5e; --slab:#5b3b1d; }
  #wCards .rcard:hover{ --lift:9px; transform:translateY(-2px); border-color:var(--cap-rim) }
  #wCards .rcard:active, #wCards .rcard.press{ --lift:2px; transform:translateY(5px); transition-duration:.05s }
  #wCards .rcard:focus-visible{ outline:3px solid var(--tint); outline-offset:3px }
  #wCards .rlabel{ color:var(--tint); font-size:17px; letter-spacing:-.01em; height:26px; line-height:26px }   /* สูงตายตัว: ชื่อไทยมีสระบน/วรรณยุกต์ (ฟอนต์สำรอง) ไม่ดันบรรทัดลงต่ำกว่าชื่ออังกฤษ */
  #wCards .ricon{ flex:none; line-height:1; width:64px; height:64px; border-radius:20px; font-size:32px; text-shadow:0 3px 4px rgba(0,0,0,.16);
    box-shadow:inset 0 2px 2px rgba(255,255,255,.75), inset 0 -3px 6px rgba(0,0,0,.07), 0 7px 14px -7px var(--glow) }
  body[data-theme="dark"] #wCards .ricon{ box-shadow:inset 0 1px 1px rgba(255,255,255,.12), inset 0 -3px 6px rgba(0,0,0,.25), 0 7px 14px -7px rgba(0,0,0,.6) }
  #wCards .rcard.cb .ricon{ background:var(--ic-cab) }
  #wCards .ricon .cabico{ width:38px; height:38px; filter:drop-shadow(0 3px 3px rgba(60,30,10,.22)) }
  :root{ --ic-cab:linear-gradient(145deg,#fbf0e2,#efd9bf); }
  body[data-theme="dark"]{ --ic-cab:linear-gradient(145deg,#4c3421,#33220f); }
  #wCards .rkey{ top:12px; right:12px; min-width:22px; height:22px; display:grid; place-items:center; padding:0 6px; border-radius:7px;
    background:var(--cap-top); border:1px solid var(--line-strong); box-shadow:0 2px 0 var(--line-strong); color:var(--ink-dim); font-size:11px }
  #wCards .rstat{ border-top:1px dashed var(--line-strong) }
  .wwrap{ max-width:1120px }
  #wCards{ grid-template-columns:repeat(4,minmax(0,1fr)); gap:20px 18px }
  @media (max-width: 1000px){ .wwrap{ max-width:680px } #wCards{ grid-template-columns:repeat(2,minmax(0,1fr)) } }
  @media (max-width: 540px){ #wCards{ grid-template-columns:1fr } #wCards .rcard{ padding:22px 14px 16px } }
  @media (prefers-reduced-motion: reduce){ #wCards .rcard{ transition:none } #wCards .rcard:hover{ transform:none } }
  /* รูปตู้ล่าสุด 3 ใบบนปุ่ม Stock Cabinet */
  .cfan{ display:flex; justify-content:center; padding:2px 0 4px }
  .cfan span{ width:48px; height:48px; border-radius:11px; overflow:hidden; background:#efe3d4; border:2px solid var(--cap-top);

  body[data-theme="dark"] #cabinet{ --wood:#c98d55; --wood-hi:#d79d66; --wood-press:#8a5a2e; --wood-soft:rgba(201,141,85,.18); --wood-bg:linear-gradient(160deg,#2c251e,#211b15) }
  #cabBar{ position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; align-items:center; gap:10px 12px; padding:12px 20px;
    background:var(--bg); border-bottom:.5px solid var(--line-strong) }

    border-radius:10px; padding:0 10px; height:36px; box-shadow:var(--ctl-shadow); color:var(--ink-faint) }

  .cabq:focus-within{ outline:2px solid var(--wood); outline-offset:1px }
  .cabseg{ display:flex; gap:3px; padding:3px; background:var(--bg2); border-radius:10px; border:.5px solid var(--line); max-width:100%; overflow-x:auto }
  .cabseg button{ border:0; background:transparent; border-radius:7px; padding:5px 10px; font-size:12.5px; cursor:pointer; color:var(--ink-dim); white-space:nowrap }
  .cabseg button b{ font-weight:600; color:var(--ink-faint); margin-left:2px; font-variant-numeric:tabular-nums }
  .cabseg button.on{ background:var(--solid); color:var(--ink); box-shadow:var(--ctl-shadow) } .cabseg button.on b{ color:var(--wood) }
  .cabseg button:focus-visible{ outline:2px solid var(--wood) }
  #cabSort{ height:36px; border-radius:10px; border:.5px solid var(--line-strong); background:var(--solid); padding:0 8px; font-size:12.5px }
  .cabadd{ display:inline-flex; align-items:center; justify-content:center; gap:6px; height:36px; padding:0 16px; border-radius:10px; border:0; cursor:pointer;
    font-weight:600; font-size:13.5px; color:#fff; background:linear-gradient(180deg,var(--wood-hi,#a66a3a),var(--wood,#8a5528));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 3px 0 var(--wood-press,#6a3f1c), 0 7px 14px -7px rgba(110,60,20,.55);
    transform:translateY(0); transition:transform .07s, box-shadow .07s; margin-bottom:3px; white-space:nowrap }
  .cabadd:hover{ filter:brightness(1.06) }

  .cabadd:focus-visible{ outline:2px solid var(--wood,#8a5528); outline-offset:3px }
  .cabadd:disabled{ opacity:.6; cursor:default }
  #cabBar .cabadd{ margin-left:auto }
  #cabSum{ display:flex; flex-wrap:wrap; gap:4px 18px; padding:12px 22px 0; font-size:12.5px; color:var(--ink-dim); min-height:30px }
  #cabSum b{ color:var(--ink); font-variant-numeric:tabular-nums } #cabSum .warn{ color:var(--warn) } #cabSum small{ color:var(--ink-faint) }
  #cabGrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:18px; padding:12px 20px 48px }
  .cabcard{ display:flex; flex-direction:column; text-align:left; background:var(--solid); border:.5px solid var(--line-strong); border-radius:14px; overflow:hidden;
    cursor:pointer; padding:0; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.06); transition:box-shadow .15s, transform .15s }

  .cbbody{ display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:22px; padding:18px; overflow:auto }

  .cbzoom{ position:absolute; right:10px; bottom:10px; font-size:11px; background:rgba(0,0,0,.5); color:#fff; border-radius:999px; padding:2px 9px; pointer-events:none }
  .cbdrop{ width:100%; height:100%; border:2px dashed rgba(138,85,40,.4); border-radius:12px; background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--wood); cursor:pointer; font-size:14px }

  .cbdrop:focus-visible{ outline:2px solid var(--wood); outline-offset:2px }
  .cbthumbs{ display:flex; flex-wrap:wrap; gap:10px; padding-top:4px }
  .cbt{ position:relative; width:72px; height:72px; border-radius:10px }

  .cbt .px, .cbt .pc{ position:absolute; top:4px; width:22px; height:22px; border-radius:50%; border:0; font-size:10.5px; cursor:pointer; background:rgba(255,255,255,.94); box-shadow:0 1px 3px rgba(0,0,0,.3); display:grid; place-items:center; padding:0 }

  .cabsel{ height:36px; border-radius:10px; border:.5px solid var(--line-strong); background:var(--solid); padding:0 8px; font-size:12.5px; max-width:190px; color:var(--ink) }

  /* ═════════ v1.21: แท็บคิวตัดงาน (Master Plan · Machine Queue) + คิวรายเครื่อง ═════════ */
  #bdTabs{flex:none;background:var(--solid);border-bottom:.5px solid var(--line-strong);padding:0 10px}

  .mqtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px;padding:12px 14px 0}
  .mqm{box-sizing:border-box;display:flex;flex-direction:column;gap:5px;min-width:0;padding:10px 12px 11px;border-radius:12px;background:var(--solid);border:1px solid var(--line-strong);color:var(--ink);font:inherit;text-align:left;cursor:pointer;position:relative}

  .mqline::before{content:"";position:absolute;left:8px;top:16px;bottom:10px;width:2px;border-radius:2px;background:var(--line-strong)}

  .mqday::before{content:"";position:absolute;left:-23px;top:17px;width:12px;height:12px;box-sizing:border-box;border-radius:50%;background:var(--solid);border:2.5px solid var(--accent)}
  .mqday.t0::before{background:var(--accent)}
  .mqday .dt{font-size:13.5px;font-weight:700;white-space:nowrap}
  .mqday .dt b{color:var(--accent);margin-right:2px}
  body[data-theme="dark"] .mqday .dt b{color:#8fb0f0}
  .mqday .segs{display:flex;gap:1px;height:10px;border-radius:5px;overflow:hidden;background:var(--bg2)}
  .mqday .segs i{display:block;height:100%;flex:none;background:var(--s2)}
  .mqday .segs i.b{background:color-mix(in srgb,var(--s2) 55%,var(--solid))}
  .mqday .segs i.c{background:var(--orange)}
  .mqday .use{font-size:11.5px;color:var(--ink-dim);white-space:nowrap}
  .mqday .use b{font-family:var(--mono);color:var(--ink)}

  .mqrow{display:grid;grid-template-columns:28px minmax(0,1fr) 76px 118px 80px 92px;align-items:center;gap:10px;padding:7px 10px;cursor:pointer;font-size:12.5px;line-height:1.35}
  .mqline .mqrow:not(.cont) + .mqrow:not(.cont){border-top:.5px solid var(--line)}
  .mqrow:hover{background:var(--bg2)}
  .mqtoday .mqrow{border-radius:9px}
  .mqtoday .mqrow:hover{background:var(--solid)}
  .mqrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .mqrow.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  .mqrow .ix{font:800 12px var(--mono);color:var(--ink-faint);text-align:right}
  .mqrow.carry .ix{color:var(--orange)}
  .mqrow .lot{min-width:0}
  .mqrow .lot b{font:800 13px var(--mono);word-break:break-all}
  .mqrow .lot small{display:block;color:var(--ink-dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mqrow .lot small.pdr{color:var(--warn)}
  .mqrow .lot small.spn{color:var(--accent)}
  body[data-theme="dark"] .mqrow .lot small.spn{color:#8fb0f0}
  .mqtag{display:inline-block;margin-left:7px;padding:0 7px;border-radius:10px;font-size:10.5px;font-weight:800;line-height:17px;vertical-align:1px;color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,transparent)}
  .mqtag.now{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
  .mqrow .pcs{font:800 13px var(--mono);text-align:right;white-space:nowrap}
  .mqrow .pcs small{display:block;font:400 10.5px var(--font);color:var(--ink-faint)}
  .mqmat{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px}
  .mqmat.ok{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
  .mqmat.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
  .mqmat.unk{color:var(--ink-dim);border:.5px dashed var(--line-strong)}
  .mqrow .sb,.mqrow .due{font:700 12px var(--mono);white-space:nowrap}
  .mqrow .sb small,.mqrow .due small{display:block;font:400 10.5px var(--font);color:var(--ink-faint)}
  .mqrow .sb.late,.mqrow .due.red{color:var(--bad)}
  .mqrow .due.amb{color:var(--warn)}
  .mqrow.cont{grid-template-columns:30px minmax(0,1fr);padding-top:3px;padding-bottom:3px;opacity:.72}
  .mqrow.cont .lot b{font-size:12px}
  /* วันนี้ (ยิงจริง) */
  .mqrow.mqt{grid-template-columns:22px minmax(0,1fr) auto;grid-template-areas:"ix lot pcs" ". pr st";row-gap:5px;cursor:default;padding:8px 8px}
  .mqrow.mqt .ix{grid-area:ix} .mqrow.mqt .lot{grid-area:lot} .mqrow.mqt .pcs{grid-area:pcs} .mqrow.mqt .mqprog{grid-area:pr} .mqrow.mqt .mqst{grid-area:st;text-align:right}
  .mqrow.mqt[data-bd]{cursor:pointer}
  .mqrow.mqt .ix{color:var(--good);font-size:11px}
  .mqrow.mqt.done{opacity:.7}
  .mqprog .pb{display:block;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
  .mqprog .pb i{display:block;height:100%;background:var(--s2);border-radius:4px}
  .mqrow.mqt.done .mqprog .pb i{background:var(--good)}
  .mqprog small{display:block;font:400 10.5px var(--mono);color:var(--ink-dim);margin-top:2px}
  .mqst{font-size:12px;font-weight:700;color:var(--ink-dim);white-space:nowrap}
  .mqst.ok{color:var(--good)}
  .mqfoot{padding:10px 18px 16px;border-top:.5px solid var(--line);font-size:12px;line-height:1.55;display:flex;flex-direction:column;gap:6px;color:var(--ink-dim)}

  .mcpop .mqlink{align-self:flex-start;padding:3px 10px;font-size:12px}

  /* จอทีวี (#board-mc-tv) */
  body.tv .mqm .mqh b{font-size:18px} body.tv .mqm .mqtd b{font-size:22px} body.tv .mqm .mqqq,body.tv .mqm .mqnow{font-size:13.5px}
  body.tv .mqname h2{font-size:32px} body.tv .mqrow{font-size:15px} body.tv .mqrow .lot b{font-size:16px} body.tv .mqrow .lot small{font-size:13.5px}
  body.tv .mqday .dt{font-size:16px} body.tv .mqm kbd{display:none}

  @media (max-width: 760px){
    .mqtiles{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px 10px 0}
    .mqpanel{margin:12px 10px 0}
    .mqhead,.mqsec,.mqfoot{padding-left:12px;padding-right:12px}

    .mqday .segs{grid-column:1/-1;order:3}
    .mqrow{grid-template-columns:24px minmax(0,1fr) auto;grid-template-areas:"ix lot pcs" ". mat mat" ". sb due";row-gap:4px;padding:8px 6px}
    .mqrow .ix{grid-area:ix} .mqrow .lot{grid-area:lot} .mqrow .pcs{grid-area:pcs} .mqrow .mqmat{grid-area:mat} .mqrow .sb{grid-area:sb} .mqrow .due{grid-area:due;text-align:right}
    .mqrow.cont{grid-template-areas:none} .mqrow.cont .ix,.mqrow.cont .lot{grid-area:auto}
  }

  /* ═════════ v1.22: วัตถุดิบ Lot พรุ่งนี้ (คอลัมน์ขวา) ═════════ */
  .mqrmlots{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
  .mqrmlots button{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--mono);padding:4px 9px;border-radius:8px;border:.5px solid var(--line-strong);background:var(--solid);color:var(--ink);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mqrmlots button:hover{border-color:var(--accent)}
  .mqrmlots button i{font-style:normal;font-family:var(--font)}
  .mqrmlots button.ok i{color:var(--good)} .mqrmlots button.bad{border-color:color-mix(in srgb,var(--bad) 50%,transparent)} .mqrmlots button.bad i{color:var(--bad)} .mqrmlots button.unk i{color:var(--ink-faint)}
  .mqrmsum{font-size:12px;color:var(--ink-dim);margin:0 0 8px;line-height:1.5}

  .mqrmt th:first-child,.mqrmt td:first-child{text-align:left}

  .mqrmt td:first-child{font-family:var(--font);white-space:normal;word-break:break-word}
  .mqrmt td:first-child .rmc{font-family:var(--mono);font-weight:700}
  .mqrmt td small{display:block;font:400 11px var(--font);color:var(--ink-dim)}
  .mqrmt td small.lt{font:400 10.5px var(--mono);color:var(--ink-faint);margin-top:1px}
  .mqrmt td:last-child{width:22px;text-align:center}
  .mqrmt tr.short td{background:color-mix(in srgb,var(--bad) 7%,transparent)}
  .mqacc{margin-top:12px;border-top:.5px solid var(--line)}
  .mqacc summary{cursor:pointer;font-size:12.5px;font-weight:700;padding:9px 0 6px;color:var(--ink-dim)}
  .mqacc[open] summary{color:var(--ink)}
  .mqrmnote{font-size:12px;color:var(--ink-dim);margin-top:12px;line-height:1.6;word-break:break-word}
  .mqrmnote b{font:600 11.5px var(--mono);color:var(--ink)}

  /* ═════════ v1.22: กระดิ่งแจ้งเตือน ═════════ */
  .bdbell{position:relative;display:inline-flex;align-items:center;padding:5px 9px;color:var(--ink-dim)}
  .bdbell svg{width:18px;height:18px;display:block}

  .bdbell.open{background:var(--bg2)}
  .bdbell .bdg{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:9px;background:var(--bad);color:#fff;font:800 10.5px/18px var(--mono);text-align:center;box-shadow:0 0 0 2px var(--solid)}
  .bdbellpop{position:fixed;z-index:60;background:var(--solid);border:.5px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px 8px;overflow:auto;font-size:12.5px}
  .bdbellpop .h{display:flex;align-items:baseline;gap:8px;padding-bottom:6px}

  .bdbellpop .src b{font-family:var(--mono)}
  .bdbellpop .src.no{color:var(--bad);font-weight:600}
  .bdbellpop .src.ok{color:var(--ink)}
  .bdbellpop .src.off{color:var(--ink-dim)}

  /* ═════════ v1.22: แท็บขึ้นแถบบนสุด (ข้างป้าย “คิวตัดงาน”) ═════════ */
  #bdTabsTop{align-self:stretch;display:flex;margin-left:4px}

  /* ───────── v1.23 ป้าย .saw (Cut Rite Run) · ตัดแล้ว 7 วันทำงาน · คิว 1 สัปดาห์ ───────── */
  .sawc{display:inline-block;margin-left:7px;padding:0 6px;border-radius:5px;font:700 10.5px/17px var(--mono);letter-spacing:.01em;vertical-align:1px;white-space:nowrap;
    color:var(--s2);background:color-mix(in srgb,var(--s2) 11%,transparent);border:.5px solid color-mix(in srgb,var(--s2) 35%,transparent)}
  .sawc i{font-style:normal;font-weight:600;margin-left:4px;opacity:.75}

  .bcard .bm .sawc{margin-left:6px}

  .mqhday .use{font-size:11.5px;color:var(--ink-dim)} .mqhday .use b{font-family:var(--mono);color:var(--ink)}
  .mqrow.mqh{padding:5px 8px}

  .mqwk .tbtn{margin-left:8px;padding:2px 10px;font-size:12px}

  table.crxt td small{display:block;font:400 10.5px var(--font);color:var(--ink-faint)}

  body.tv .sawc{font-size:12.5px;line-height:20px}

  /* ───────── v1.24 Machine Queue: รายละเอียด Lot ในคอลัมน์ขวา · แผ่นตัดตาม Cut Rite · เวลาตัดในป้าย SAW ───────── */
  .sawc em{font-style:normal;font-weight:600;margin-left:6px;padding-left:6px;border-left:.5px solid currentColor;opacity:.9}

  /* ═════════ v1.26 Cutting Dashboard (ภาพรวมผู้บริหาร · #board-dash) ═════════
     14:35 ผู้ใช้ส่งรูปตัวอย่าง: การ์ดขาวบนพื้นฟ้าอ่อน · วงแหวน % · แท่งบางไล่สีฟ้า → ฟ้าน้ำทะเล · ชิปตัวเลข · เส้นแนวโน้ม */
  #board.dash #bdMc,#board.dash #bdFlt,#board.dash #bdCols,#board.dash #bdSelBar,#board.dash #bdMq{display:none!important}
  #board:not(.dash) #bdDash{display:none!important}
  #bdDash{--db-bg:#edf2f9;--db-card:#ffffff;--db-a:#2f6fec;--db-b:#22c1dc;--db-track:#e6ecf5;--db-ink:#1d2a44;--db-dim:#6b7891;--db-faint:#a2adc2;--db-shadow:0 6px 22px rgba(39,73,135,.08);
    --db-c1:#2f6fec;--db-c2:#1aa37a;--db-c3:#1fa9cf;--db-c4:#e8890c;--db-bad:#e5484d;
    flex:1;min-height:0;overflow:auto;padding:16px 18px 28px;background:var(--db-bg);color:var(--db-ink)}
  body[data-theme="dark"] #bdDash{--db-bg:#10151e;--db-card:#19212e;--db-a:#4d86f5;--db-b:#2fd0e6;--db-track:#263243;--db-ink:#e7edf8;--db-dim:#9aa7bf;--db-faint:#64718a;--db-shadow:0 6px 22px rgba(0,0,0,.35);
    --db-c1:#5b8ff7;--db-c2:#2fbf8f;--db-c3:#33c3e3;--db-c4:#f0a13a;--db-bad:#f0686c}
  .dbwrap{max-width:1720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  .dbc{background:var(--db-card);border-radius:18px;padding:16px 18px;box-shadow:var(--db-shadow);min-width:0;position:relative}
  .dbc > header h3{display:flex;flex-direction:column;gap:2px;font-size:16px;font-weight:800;margin:0 0 12px;color:var(--db-ink);letter-spacing:-.01em}
  .dbc > header h3 small{font-size:11.5px;font-weight:500;color:var(--db-faint)}
  .dbok{color:var(--db-c2);font-weight:700;font-size:13px;padding:8px 0}
  #bdDash .mqnone{color:var(--db-dim)}
  /* แถวบน: วงแหวน · แท่ง · รายเครื่อง · คอลัมน์ขวา */
  .dbtop{display:grid;grid-template-columns:minmax(230px,.9fr) minmax(0,1.35fr) minmax(0,1.25fr) minmax(250px,.95fr);gap:16px;align-items:stretch}
  .dbpct{display:flex;flex-direction:column;align-items:center}
  .dbpct > header{align-self:stretch}
  .dbring{position:relative;flex:none}
  .dbring svg{width:100%;height:100%;display:block}
  .dbring .tr{fill:none;stroke:var(--db-track)}
  .dbring .fg{fill:none;stroke:url(#dbGr);stroke-linecap:round}
  .dbring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.1}
  .dbring .in b{font:800 34px var(--mono);letter-spacing:-.03em;color:var(--db-ink)}
  .dbring .in small{font-size:11.5px;color:var(--db-dim);margin-top:4px;font-family:var(--mono)}
  .dbpl{display:flex;justify-content:space-between;align-items:baseline;align-self:stretch;margin-top:12px;font-size:11.5px;color:var(--db-faint)}
  .dbpl .avg{color:var(--db-dim)} .dbpl .avg b{font-family:var(--mono);color:var(--db-ink)}
  /* แท่ง (HTML) */
  .dbb{display:flex;flex-direction:column}
  .dbb .pl{position:relative;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--db-track)}
  .dbb.thin .pl{height:180px;margin-top:18px}

  .dbb .c{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;cursor:default}

<script>
/* ═══════════════════════════════════════════════════════════════════════
   GasFS 1.5 (2026-10-12) — โฟลเดอร์ Server เสมือนบน Google Drive ผ่าน Apps Script (StarNexus DB 0.3+)

   ใช้ร่วมกันใน StarNexus และ Production V2: ทั้งสองโปรแกรมอ่าน/เขียนโฟลเดอร์ Server ผ่าน

   → โค้ดไฟล์กลางเดิมไม่ต้องแก้ แค่ตอนเปิดใส่ SXL.dir = GasFS.root() แทนโฟลเดอร์ที่เลือก

   ทำให้เร็วด้วย
     · รวมคำขอที่เกิดพร้อมกัน (ภายใน ~15 ms) เป็นการเรียกครั้งเดียว — Apps Script เสียค่าเดินทาง ~1.2 วิ ต่อครั้ง
     · getFile() ให้ชื่อ/ขนาด/เวลาแก้ได้ทันทีจากรายการ ไม่ดาวน์โหลดเนื้อจนกว่าจะอ่านจริง
     · จำเนื้อไฟล์ไว้ใน IndexedDB ของเครื่อง (ตามเวลาแก้) — F5 / เปิดครั้งต่อไปไม่ต้องโหลดซ้ำ
     · รายการไฟล์ขอแค่ส่วนที่เปลี่ยน (since) และไฟล์เล็กได้เนื้อมาพร้อมรายการเลย
   ความลับ: URL + กุญแจ เก็บใน localStorage ของเบราว์เซอร์เครื่องนั้นเท่านั้น (ไม่ลงไฟล์งาน/โฟลเดอร์/การส่งออก)

          try { var f = await it.h.getFile(); it.size = f.size; plan.bytes += f.size; }
          catch (er) { it.bad = 1; plan.unreadable.push(join(it.p, it.n) + ' (' + (er && er.name || 'อ่านไม่ได้') + ')'); }
          scan.files++; tick();
        }
      }
      var ws = []; for (var w = 0; w < Math.min(SCAN_PAR, need.length); w++) ws.push(worker());
      await Promise.all(ws);
      for (var j = 0; j < subs.length; j++) { if (aborted()) return; await walk(subs[j][0], subs[j][1]); }
    }
    await walk(src, '');
    if (aborted()) return { cancelled: true, plan: plan };
    if (plan.unreadable.length) { plan.files = plan.files.filter(function (f) { return !f.bad; }); plan.skipped = plan.skipped.concat(plan.unreadable); }
    tick(true);
    if (opt.onPlan) { var go = await opt.onPlan(plan); if (go === false) return { cancelled: true, plan: plan }; }
    var st = { done: 0, total: plan.files.length, bytes: 0, totalBytes: plan.bytes, skippedSame: 0, t0: Date.now(), errors: [] };
    var byDir = {};
    plan.files.forEach(function (f) { (byDir[f.p] = byDir[f.p] || []).push(f); });
    var dirsList = Object.keys(byDir);
    for (var di = 0; di < dirsList.length; di++) {
      var p = dirsList[di];
      if (opt.signal && opt.signal.aborted) break;
      var remote = {};
      try { var Lr = await self.list(p, true); remote = Lr.files; } catch (e) { remote = {}; }
      var small = [], smallBytes = 0;
      var flushSmall = async function () {
        if (!small.length) return;
        var batch = small.splice(0); smallBytes = 0;
        var o = await self.call({ a: 'fsWrite', p: p, files: batch.map(function (x) { return { n: x.n, c: x.c }; }), bulk: 1 });
        o.files.forEach(function (r, i) { self._touch(p, r.n, r.u, batch[i].c.length, batch[i].c); });
        self._dirAdd(p);
        batch.forEach(function (x) { st.done++; st.bytes += x.size; });
        if (opt.onProgress) opt.onProgress(st);
      };
      var big = [];
      for (var k = 0; k < byDir[p].length; k++) {
        var it = byDir[p][k];
        if (opt.signal && opt.signal.aborted) break;
        if (remote[it.n] && opt.resume !== false) { st.done++; st.bytes += it.size; st.skippedSame++; if (opt.onProgress) opt.onProgress(st); continue; }
        try {
          var bytes = new Uint8Array(await (await it.h.getFile()).arrayBuffer());
          var c = await gz(bytes);
          if (c.length <= 8000) { small.push({ n: it.n, c: c, size: it.size }); smallBytes += c.length; if (small.length >= 300 || smallBytes > 1500000) await flushSmall(); }
          else big.push({ it: it, bytes: bytes });
          if (big.length >= 4) { await Promise.all(big.splice(0).map(function (b) { return self.write(p, b.it.n, b.bytes).then(function () { st.done++; st.bytes += b.it.size; if (opt.onProgress) opt.onProgress(st); }, function (e) { st.errors.push(join(p, b.it.n) + ': ' + e.message); }); })); }
        } catch (e) { st.errors.push(join(p, it.n) + ': ' + e.message); }
      }
      try { await flushSmall(); } catch (e) { st.errors.push(p + ': ' + e.message); }
      if (big.length) await Promise.all(big.splice(0).map(function (b) { return self.write(p, b.it.n, b.bytes).then(function () { st.done++; st.bytes += b.it.size; if (opt.onProgress) opt.onProgress(st); }, function (e) { st.errors.push(join(p, b.it.n) + ': ' + e.message); }); }));
    }
    st.ms = Date.now() - st.t0;
    return { plan: plan, st: st };
  };

  var LSK = 'sxlocaltrial:furnitech:gas';

  function cfgGet() { try { return JSON.parse(localStorage.getItem(LSK) || 'null') || {}; } catch (e) { return {}; } }
  function cfgSet(v) { try { if (v == null) localStorage.removeItem(LSK); else localStorage.setItem(LSK, JSON.stringify(v)); } catch (e) {} }

  var _cur = null;
  return {
    VER: VER,
    open: function (url, key, opt) { _cur = new FS(url, key, opt); return _cur; },
    current: function () { return _cur; },
    cfgGet: cfgGet, cfgSet: cfgSet,

    _FS: FS
  };
})();

      /* อ่านของล่าสุดบน Drive ก่อนทุกครั้ง แล้วค่อยเอาสิ่งที่แก้ในเครื่องนี้วางทับ — คนอื่นแก้รหัสอื่นอยู่ ไม่หาย */
      var L = await S.fs.list('items', true).catch(function (e) { if (e && e.name === 'NotFoundError') return null; throw e; });
      var f = L && L.files['edits.json'], base = { v: 1, items: {}, cats: [] };
      if (f) { var et = await readText('items', 'edits.json');                    // v1.3: อ่านไม่ได้/เสีย = โยนผิดพลาด ไม่บันทึกทับของคนอื่น
        try { JSON.parse(et); } catch (x) { var bx = new Error('edits.json บน Drive อ่านไม่ออก — ไม่บันทึกทับ (กันราคา/หมวดของคนอื่นหาย)'); bx.bad = true; throw bx; }
        base = parseEdits(et); }
      ops.forEach(function (o) { applyOp(base, o); });

      var bytes = new TextEncoder().encode(JSON.stringify(base)), c = await GasFS.gz(bytes);
      var o = await S.fs.call({ a: 'fsWrite', p: 'items', n: 'edits.json', c: c, ifU: f ? f.u : 0 });
      if (o.files && o.files.length) {
        S.fs._touch('items', 'edits.json', o.files[0].u, c.length, c);
        S.editsU = o.files[0].u;
        S.pend = S.pend.slice(ops.length);                                 // ที่แก้เพิ่มระหว่างบันทึก รอรอบหน้า
        S.edits = base; S.pend.forEach(function (x) { applyOp(S.edits, x); });

        S.saving = false; if (S.pend.length) saveSoon(); refresh(); return true;
      }
      await new Promise(function (r) { setTimeout(r, 400 + tryNo * 500); });   // มีคนบันทึกแทรก — อ่านใหม่แล้วลองอีกครั้ง
    }

  } catch (e) { console.error(e); $('saveSt').textContent = '✗ บันทึกไม่สำเร็จ'; toast('บันทึกไม่สำเร็จ: ' + netMsg(e) + ' — จะลองใหม่อัตโนมัติ', 4000); S.saving = false; setTimeout(saveEdits, e && e.bad ? 60000 : 8000); return false; }   // v1.3: ไฟล์เสียไม่หายเอง — ลองห่างขึ้น
}

/* ═════════ กรอง / เรียง ═════════ */
function sortVal(x, k) {

  if (k === 'onhand') return x.onhand == null ? -Infinity : x.onhand; if (k === 'avail') return x.avail == null ? -Infinity : x.avail;
  if (k === 'demand') return x.demand == null ? -Infinity : x.demand;

  return '';
}
function sorted() {
  var k = S.sort.k, d = S.sort.d, key = k + d + ':' + S.items.length + ':' + (k === 'price' ? S.editsU + ':' + S.pend.length : '');
  if (S.order && S.orderKey === key) return S.order;

  if (k === 'code') a.sort(function (p, q) { return p.code < q.code ? -d : p.code > q.code ? d : 0; });
  else if (str) a.sort(function (p, q) { return coll.compare(sortVal(p, k), sortVal(q, k)) * d; });
  else a.sort(function (p, q) { var x = sortVal(p, k), y = sortVal(q, k); return x === y ? (p.code < q.code ? -1 : 1) : (x < y ? -d : d); });

}
function match(x) {

  if (F.wh != null) { if (!x.stock) return false; var ok = false; for (var i = 0; i < x.stock.length; i++) if (x.stock[i].wh === F.wh && x.stock[i].onhand) { ok = true; break; } if (!ok) return false; }
  if (F.stock === 'has' && !(x.onhand > 0)) return false;
  if (F.stock === 'none' && x.onhand > 0) return false;
  if (F.stock === 'neg' && !(x.onhand < 0)) return false;
  if (F.price !== 'all') { var p = priceOf(x); if (F.price === 'has' && p.v == null) return false; if (F.price === 'none' && p.v != null) return false; if (F.price === 'me' && !p.me) return false; }
  if (F.img === 'has' && !S.thumbs.has(x.code)) return false;
  if (F.img === 'none' && S.thumbs.has(x.code)) return false;
  if (F.dem === 'has' && !(x.demand > 0)) return false;
  if (F.dem === 'short') { var sh = shortOf(x); if (sh == null || sh >= 0) return false; }
  if (S._tok) { for (var t = 0; t < S._tok.length; t++) if (x.s.indexOf(S._tok[t]) < 0) return false; }
  return true;
}

/* ═════════ รูปสินค้า ═════════ */
async function shrink(file, max, q) {
  var bmp = null; try { bmp = await createImageBitmap(file); } catch (e) {}
  var w, h, src;
  if (bmp) { w = bmp.width; h = bmp.height; src = bmp; }
  else { src = await new Promise(function (res, rej) { var im = new Image(); im.onload = function () { res(im); }; im.onerror = function () { rej(Error('เปิดรูปนี้ไม่ได้')); }; im.src = URL.createObjectURL(file); }); w = src.naturalWidth; h = src.naturalHeight; }
  var k = Math.min(1, max / Math.max(w, h)), cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
  var cv = document.createElement('canvas'); cv.width = cw; cv.height = ch; var g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, cw, ch); g.drawImage(src, 0, 0, cw, ch);       // พื้นขาว (PNG โปร่งใส → JPG)
  var blob = await new Promise(function (r) { cv.toBlob(r, 'image/jpeg', q); });
  return new Uint8Array(await blob.arrayBuffer());
}
async function uploadImage(code, file) {
  if (!file || !/^image\//.test(file.type || 'image/')) { toast('ไฟล์นี้ไม่ใช่รูป'); return; }
  toast('กำลังย่อและส่งรูปขึ้น Google Drive…', 8000);
  try {
    var big = await shrink(file, 1600, 0.85), th = await shrink(file, 320, 0.8), n = fname(code);
    var f1 = await S.fs.write('items/img', n, big), f2 = await S.fs.write('items/thumb', n, th);
    S.imgU.set(code, f1.u); S.thumbs.set(code, f2.u);
    var old = S.thumbUrl.get(code); if (old) URL.revokeObjectURL(old);
    S.thumbUrl.set(code, URL.createObjectURL(new Blob([th], { type: 'image/jpeg' })));
    toast('✓ ส่งรูปของ ' + code + ' ขึ้น Google Drive แล้ว (' + Math.round(big.length / 1024) + ' KB)');
    if (S.sel === code) showDetail(code); refresh(); renderSideCounts();
  } catch (e) { console.error(e); toast('ส่งรูปไม่สำเร็จ: ' + (e.message || e), 5000); }
}
async function deleteImage(code) {
  if (!confirm('ลบรูปของ ' + code + ' ออกจาก Google Drive?')) return;
  var n = fname(code);
  try { if (S.imgU.has(code)) await S.fs.del('items/img', n); if (S.thumbs.has(code)) await S.fs.del('items/thumb', n);
    S.imgU.delete(code); S.thumbs.delete(code); var u = S.thumbUrl.get(code); if (u) URL.revokeObjectURL(u); S.thumbUrl.delete(code);
    toast('ลบรูปแล้ว'); if (S.sel === code) showDetail(code); refresh(); } catch (e) { toast('ลบไม่สำเร็จ: ' + (e.message || e)); }
}

      return '<div class="mqrow mqt' + (cur ? ' cur' : '') + (done ? ' done' : '') + (g && bdMqSelId() === g.id ? ' sel' : '') + '"' + (g && !g.closed ? ' data-bd="' + esc(g.id) + '" tabindex="0"' : '') + '>'
        + '<span class="ix">' + (cur ? (run ? '▶' : '❚❚') : '') + '</span>'
        + '<span class="lot"><b>' + esc(lot) + '</b>' + /* v1.23 */ crxChip(lot) + (cur ? '<span class="mqtag now">' + (run ? 'กำลังยิง' : 'ยิงล่าสุด · หยุด ' + bdH(idle)) + '</span>' : '') + '<small>' + esc(g ? g.remark || '—' : '') + '</small></span>'

  } else h += '<p class="mqnone">' + (!B.set.cutOn ? 'ปิดอ่านการยิงตัดอยู่ (⚙ แหล่งข้อมูล)' : X.err ? 'อ่านการยิงตัดไม่ได้ — ' + esc(X.err) : X.ok ? 'วันนี้เครื่องนี้ยังไม่ได้ยิงตัด' : 'กำลังอ่านการยิงตัด…') + '</p>';

  h += '<div class="mqsec mqq"><h3>คิวรอตัด' + (BQ.all ? ' (ทั้งคิว)' : ' 1 สัปดาห์') + '<small>' + (BQ.all ? '' : 'ถึง ' + esc(bdDayTxt(bdMqDayMs(P, WK - 1))) + ' · ') + 'เรียงตามที่เครื่องนี้จะได้ตัด · หนึ่งวัน = ' + fmtN(pm.ppd) + ' ชิ้น</small></h3>';
  if (!pm.q.length) h += '<p class="mqnone">ยังไม่มี Lot ลงเครื่องนี้ — Lot ที่พร้อมตัดลงเครื่องอื่นที่ว่างกว่าหมดแล้ว</p>';
  else {
    var ppd = pm.ppd, days = new Map(), D = function (k) { var d = days.get(k); if (!d) { d = { k: k, rows: [], segs: [], used: 0 }; days.set(k, d); } return d; };
    pm.q.forEach(function (e) {
      var s = e.start, f = e.start + (e.p || 0), d0 = Math.floor(s / ppd + 1e-9), d1 = e.p > 0 ? Math.max(d0, Math.floor(f / ppd - 1e-9)) : d0;
      e.d0 = d0; e.d1 = d1; D(d0).rows.push({ e: e });
      for (var k = d0; k <= d1; k++) { var ov = Math.min(f, (k + 1) * ppd) - Math.max(s, k * ppd); if (ov > 0) { D(k).segs.push({ e: e, v: ov }); D(k).used += ov; } if (k > d0) D(k).rows.push({ e: e, cont: true, v: ov }); }
    });
    var shown = 0, cut = false, keys = Array.from(days.keys()).sort(function (a, b) { return a - b; }), wkCut = false;
    h += '<div class="mqline">';
    for (var ki = 0; ki < keys.length && !cut; ki++) {
      var d = days.get(keys[ki]), alt = 0;

      h += '<div class="mqday' + (d.k === 0 ? ' t0' : '') + '"><span class="dt">' + (d.k === 0 ? '<b>' + bdTmrW(P) + '</b> ' + esc(bdDayTxt(P.tmr)) : esc(bdDayTxt(bdMqDayMs(P, d.k)))) + '</span>'
        + '<span class="segs" aria-hidden="true">' + d.segs.map(function (sg) { return '<i class="' + (sg.e.carry ? 'c' : (alt++ % 2 ? 'b' : 'a')) + '" style="width:' + Math.min(100, sg.v / ppd * 100).toFixed(2) + '%" title="' + esc(sg.e.g.id + ' · ' + fmtN(Math.round(sg.v)) + ' ชิ้น') + '"></i>'; }).join('') + '</span>'
        + '<span class="use"><b>' + fmtN(Math.round(d.used)) + '</b> / ' + fmtN(ppd) + ' ชิ้น</span></div>';

        var r = d.rows[ri];
        if (r.cont) { h += '<div class="mqrow cont" data-bd="' + esc(r.e.g.id) + '"><span class="ix">↳</span><span class="lot"><b>' + esc(r.e.g.id) + '</b><small>ต่อจากวันก่อน · ' + fmtN(Math.round(r.v)) + ' ชิ้นในวันนี้</small></span></div>'; continue; }

    /* v1.23 หลัง 1 สัปดาห์: บรรทัดสรุป + ปุ่มดูทั้งคิว (ไม่จำ — เปิดหน้าใหม่กลับเป็น 1 สัปดาห์) */
    else if (wkCut) { var later = pm.q.filter(function (e) { return e.d0 >= WK; }), laterP = later.reduce(function (a, e) { return a + (e.p || 0); }, 0);

    else if (BQ.all && lastDay >= WK) h += '<p class="mqmore mqwk"><button class="tbtn" data-mqall="0">ย่อเหลือ 1 สัปดาห์</button></p>';

  /* v1.24 เลือก Lot ไว้ (กดแถว) = คอลัมน์ขวาเป็นรายละเอียด Lot นั้น แทนแผงที่เด้งออกข้าง */

  return h + (gl && !gl.closed ? bdMqLot(gl, P) : bdMqRm(P, pm)) + '</div></section>';   // v1.22 คอลัมน์ขวา = วัตถุดิบ Lot พรุ่งนี้

/* ท้าย: Lot ที่ไม่เข้าคิวเครื่อง + วิธีจัด */

/* ───────── v1.22: วัตถุดิบของ Lot ที่เครื่องนี้เริ่มตัดพรุ่งนี้ (คอลัมน์ขวา) ─────────
   แหล่ง = g.rmRows ของแผน (ค้างเบิกใน AX = lots/rm.csv · หรือ rm[] ของข้อมูลเพิ่ม) หลังกันของตามลำดับคิวแล้ว (ok = Lot นั้นได้ของครบ)

   รวมตามรหัส: ต้องเบิกรวม · ยอดในคลัง (หรือยอดใช้ได้ ตาม ⚙) · Lot ที่ใช้ · แผ่นต้องตัด (isBoardCode — กติกาเดียวกับ lot-parts) ขึ้นก่อน · อุปกรณ์/อื่น ๆ พับไว้ */
function bdMqRm(P, pm) {

  day0.forEach(function (e) { if (!seen.has(e.g.id)) { seen.add(e.g.id); lots.push(e.g); } });
  var basis = B.set.rmBasis === 'avail' ? 'avail' : 'onhand', agg = new Map(), issued = [], noRm = [], stOk = !!B.stock;
  lots.forEach(function (g) {

    if (!rows.length) { (g.mat === 'ok' ? issued : noRm).push(g); return; }
    rows.forEach(function (r) { var k = r.code.toUpperCase(), a = agg.get(k);
      if (!a) { a = { code: r.code, name: r.name || '', unit: r.unit || '', grp: r.grp || '', need: 0, stock: r[basis], known: r.known, ok: true, lots: [], board: isBoardCode(r.code) }; agg.set(k, a); }
      a.need += r.qty; if (!r.ok) a.ok = false; a.lots.push({ id: g.id, q: r.qty }); if (!a.name && r.name) a.name = r.name; });

  var all = Array.from(agg.values()), coll = function (a, b) { return (a.ok === b.ok ? 0 : a.ok ? 1 : -1) || String(a.code).localeCompare(String(b.code)); };

  var row = function (a) {
    var st = !stOk ? '<td class="muted">?</td>' : '<td class="' + (a.ok ? 'ok' : 'neg') + '" title="' + esc(a.ok ? 'พอให้ทุก Lot (หลังกันให้ Lot ที่อยู่ก่อนในคิว)' : 'ไม่พอ — ดูรายละเอียด Lot') + '">' + (a.ok ? '✓' : '✗') + '</td>';
    return '<tr class="' + (stOk && !a.ok ? 'short' : '') + '"><td>' + rmCodeLink(a.code) + (a.name ? '<small>' + esc(a.name) + '</small>' : '') + (!a.known && stOk ? '<small class="neg">ไม่มีในยอด Stock</small>' : '')
      + '<small class="lt">' + a.lots.map(function (l) { return esc(l.id) + ' ×' + fmtN(l.q, 3); }).join(' · ') + '</small></td>'
      + '<td>' + fmtN(a.need, 3) + (a.unit ? '<small>' + esc(a.unit) + '</small>' : '') + '</td><td>' + (a.stock == null ? '—' : fmtN(a.stock, 3)) + '</td>' + st + '</tr>'; };
  var head = '<thead><tr><th>รหัส · ชื่อ · Lot ที่ใช้</th><th>ต้องเบิก</th><th>' + (basis === 'avail' ? 'ใช้ได้' : 'ในคลัง') + '</th><th></th></tr></thead>';
  var h = '<aside class="mqrm" aria-label="วัตถุดิบ Lot ' + bdTmrW(P) + '"><div class="mqsec"><h3>วัตถุดิบ Lot ' + bdTmrW(P) + '<small>' + esc(bdDayTxt(P.tmr)) + (lots.length ? ' · ' + lots.length + ' Lot ที่เริ่มตัดที่เครื่องนี้' : '') + '</small></h3>';
  if (!lots.length) return h + '<p class="mqnone">' + bdTmrW(P) + 'ยังไม่มี Lot เริ่มตัดที่เครื่องนี้</p></div></aside>';
  h += '<div class="mqrmlots">' + lots.map(function (g) { var s1 = lotSt(g);
    return '<button type="button" data-bd="' + esc(g.id) + '" class="' + s1 + '" title="' + esc((g.remark || '') + (s1 === 'bad' ? ' · วัตถุดิบไม่พอ' : s1 === 'unk' ? ' · ยังไม่มีข้อมูลวัตถุดิบ' : '')) + '">' + esc(g.id) + '<i>' + (s1 === 'ok' ? '✓' : s1 === 'bad' ? '✗' : '?') + '</i></button>'; }).join('') + '</div>';
  /* v1.24 แผ่นตัดตาม Cut Rite ของ Lot พรุ่งนี้ (แสดงแม้เบิกครบแล้ว — เดิมตารางว่างเพราะดูแค่รายการค้างเบิก) */
  var cx = bdMqCrSheets(lots);
  h += '<h4 class="mqlh4">แผ่นตัดตาม Cut Rite<small>' + (cx.rows.length ? fmtN(cx.n, 3) + ' แผ่น · ' + cx.rows.length + ' รหัส · ' : '') + (lots.length - cx.none.length) + '/' + lots.length + ' Lot มีเลข .saw</small></h4>'

    + (cx.rows.length && cx.none.length ? '<p class="mqrmnote">ยังไม่มีเลข .saw: <b>' + cx.none.map(function (g) { return esc(g.id); }).join(' · ') + '</b></p>' : '');

    + ' · เทียบ' + (basis === 'avail' ? 'ยอดใช้ได้' : 'ยอดในคลัง') + 'รวมทุกคลัง' + (stOk ? '' : ' (ยังไม่มียอด Stock)') + '</p>';
  if (all.length) {
    h += boards.length ? '<table class="mqrmt">' + head + '<tbody>' + boards.map(row).join('') + '</tbody></table>' : '<p class="mqnone">ไม่มีแผ่นที่ยังต้องเบิก</p>';
    if (others.length) h += '<details class="mqacc"' + (BQ.accOpen || !boards.length ? ' open' : '') + '><summary>อุปกรณ์ / อื่น ๆ · ' + others.length + ' รายการ' + (others.some(function (a) { return stOk && !a.ok; }) ? ' <span class="neg">(มีที่ไม่พอ)</span>' : '') + '</summary><table class="mqrmt">' + head + '<tbody>' + others.map(row).join('') + '</tbody></table></details>';
  }
  if (issued.length || noRm.length) h += '<p class="mqrmnote">' + (issued.length ? 'เบิกครบแล้ว (ไม่มีรายการค้างเบิกใน AX): <b>' + issued.map(function (g) { return esc(g.id); }).join(' · ') + '</b>' : '')
    + (issued.length && noRm.length ? '<br>' : '') + (noRm.length ? 'ยังไม่มีรายการวัตถุดิบ (นอกช่วงที่ StarSync ดึง): <b>' + noRm.map(function (g) { return esc(g.id); }).join(' · ') + '</b>' : '') + '</p>';

/* ───────── v1.22: กระดิ่งแจ้งเตือน (แทนแถบแหล่งข้อมูลที่เคยขึ้นเหนือคิว) ─────────
   เนื้อหาเดิมทุกบรรทัด (bdBanner วาดลง #bdBanner ที่ซ่อนไว้) · ตัวเลขแดง = จำนวนบรรทัด ✗ (แหล่งข้อมูลที่พัง/ค้าง) · กดกระดิ่ง = กล่องรายการ */
