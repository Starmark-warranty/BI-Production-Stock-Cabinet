<html lang="th">
<head>

<title>StarStock · Lot ผลิต (ไฟล์เสริมของ index.html)</title>
<!--
  StarStock · หน้า Lot ผลิต — lots.html  (lots v1.0 · 2026-10-24)

  ไฟล์นี้คืออะไร
    · หน้า Lot ผลิต (ปุ่ม 2 ที่ HOME · #lots) ทั้งหน้า: โครงหน้า · CSS · แถบซ้าย (Stage / enddate / Bu / Pool) · ค้นหา/เรียง · ตาราง
      · ตัวกรองรายคอลัมน์แบบ Excel (v1.9) · แผงรายละเอียด Lot · ⬇ CSV · ⬆ นำเข้า CSV / ลากไฟล์มาวาง · ปุ่ม ✓ ปิดว่าจบ… · คีย์ลัด
    · แยกออกจาก StarStock v2.45 (index.html) ใน v2.46 ให้ 2 คนแก้พร้อมกันได้: คนแก้หน้า Lot ผลิต แก้/อัปไฟล์นี้ไฟล์เดียว
    · วางไว้โฟลเดอร์เดียวกับ index.html (คู่กับ sawplan.html / edgeplan.html / drillplan.html) — index.html โหลดไฟล์นี้เองตอนเปิดหน้า
    · เปิดไฟล์นี้ตรง ๆ = หน้าบอกวิธีใช้ (ไม่มีข้อมูล) — ดูหน้า Lot ผลิตที่ index.html#lots

  ทำงานยังไง (ตัวโหลด SXM ใน index.html — ค้น “หน้าแยกไฟล์ (SXM)”)
    · index อ่านไฟล์นี้ → ใส่ <style id="sxmCss"> ต่อท้าย <head> ของ index (หลัง CSS ของ index = กฎที่นี่ชนะเมื่อความเจาะจงเท่ากัน)
      → ใส่ <template id="sxmHtml"> ลงใน <div id="lots"> → รัน <script id="sxmJs"> ด้วย eval “ภายในสโคปของ index” (sxmEval)
        (โค้ดที่นี่เรียกตัวแปร/ฟังก์ชันของ index ได้ตรง ๆ: L · B · esc · fD · ldBadge · lotLoad … — รายชื่อทั้งหมดอยู่ใน LOTS_NEED)
      → ท้ายโค้ดเรียก sxmRegister('lots', { init, show, … }) → index เรียก init() (ผูกปุ่ม) แล้ววาดถ้าอยู่หน้านี้
    · <script id="sxmJs"> ตั้ง type="text/x-starstock" = เบราว์เซอร์ไม่รันเองตอนเปิดไฟล์นี้ตรง ๆ (รันใน index เท่านั้น)
    · เลขบรรทัดใน error (console) = เลขบรรทัดของไฟล์นี้ (ชื่อไฟล์ขึ้นเป็น lots.html)

  แก้หน้า Lot ผลิต
    1. แก้ไฟล์นี้ → อัปขึ้น GitHub ทับไฟล์เดิม → เปิด StarStock กด Ctrl+F5 (ไม่ต้องแตะ index.html)
    2. บวกเลข LOTS_VER (1.0 → 1.1 → 1.2 …) และเพิ่มบรรทัดบนสุดของ CHANGELOG ข้างล่าง
       ทุกจุดที่แก้มีคอมเมนต์ไทย /* ───────── lots 1.x: หัวข้อ ───────── */ เล่าว่าเดิมเป็นยังไง ทำไมแก้ แก้ยังไง (เหมือนใน index)
    3. ทดสอบ: เปิด index.html#lots → console ต้องไม่มี error · ชี้ที่ “v…” มุมบนซ้าย = เห็นเลขรุ่นของไฟล์นี้
       โค้ดพัง = ข้อความ error มุมจอ (หน้าอื่นของ StarStock ไม่พังตาม)

  กติกา
    · ชื่อที่ประกาศในไฟล์นี้อยู่ในสโคปของไฟล์นี้เท่านั้น — index มองเห็นแค่ของที่ส่งใน sxmRegister(…) ท้ายโค้ด
    · ห้ามประกาศชื่อซ้ำกับของ index (จะบังตัวของ index ในไฟล์นี้) — ยกเว้นชื่อที่ index มีตัวแทน (lotShow · lotRefresh · lotDraw
      · lotShowDetail · lotCloseDetail · lotRenderFresh · lotBanner · lotRenderSide · lotSegOn · lotKey · lotBindUi) ซึ่งตั้งใจให้ตัวจริงอยู่ที่นี่
    · ใช้ฟังก์ชันของ index เพิ่ม = เติมชื่อใน LOTS_NEED · index เปลี่ยนชื่อ/ลบตัวที่อยู่ใน LOTS_NEED = ต้องแก้ไฟล์นี้ด้วย
    · ของหน้า Lot ผลิตที่ยังอยู่ใน index.html (ใช้ร่วมกับหน้าอื่น — แก้ตรงนั้นกระทบ HOME / คิวตัดงาน / Dashboard ด้วย):
        L (ข้อมูล data 6 ทั้งหมด) · lotLoad / lotBuild / lotApply / lotAfterLoad (อ่าน+เทียบไฟล์ · รอบ 30 วิ) · lotBiMap · lotCounts / lotSrcTxt (HOME)
        · lotDate / lotStage / lotNum · stgHtml · lotSavePref / lotCfSer (จำค่าที่เลือก) · ปิด Lot เอง (LD · ldAsk · ldBadge · ldBulk · ตัวรับคลิก [data-ldlist])
        · openLot (เปิด Lot จากหน้าอื่น) · CSS ตำแหน่ง/ซ่อน #lots ตามหน้า · ป้าย #lotFresh บนแถบหัว
    · ตัวรับคลิก/คีย์ (document.addEventListener) ลงทะเบียนครั้งเดียวตอนโหลด — index ไม่โหลดไฟล์นี้ซ้ำจนกว่าจะ F5
    · ห้ามมีข้อความ </script> ในโค้ด · </style> ใน CSS · </template> ในโครงหน้า (ปิดแท็กก่อนเวลา)

  CHANGELOG (ของไฟล์นี้ — index.html มีของตัวเอง)
    1.0 (2026-10-24) REFACTOR แยกออกจาก StarStock v2.45 (index.html) — โครงหน้า + CSS 81 กฎ + โค้ด 43 ชิ้น ยกมาทั้งบรรทัด (หน้าตาเหมือนเดิม)
-->
<style>
  /* หน้านี้เมื่อเปิดตรง ๆ (ไม่ผ่าน index.html) */
  :root{--bg:#f3f5f9;--card:#fff;--ink:#1d2a44;--dim:#6b7891;--a:#0a7cff}
  @media (prefers-color-scheme: dark){:root{--bg:#10151e;--card:#19212e;--ink:#e7edf8;--dim:#9aa7bf;--a:#4d9bff}}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif}
  .solo{max-width:640px;margin:48px auto;padding:24px 28px;background:var(--card);border-radius:18px;box-shadow:0 6px 22px rgba(39,73,135,.1)}
  .solo h1{margin:0 0 6px;font-size:22px} .solo p{margin:8px 0;color:var(--dim)} .solo code{font:13px ui-monospace,Consolas,monospace}
  .solo a.go{display:inline-block;margin-top:12px;padding:9px 18px;border-radius:999px;background:var(--a);color:#fff;text-decoration:none;font-weight:700}
  @media (max-width:700px){.solo{margin:16px;padding:18px 16px}}
</style>
<style id="sxmCss">
  /* ┄ สำเนาหัวบล็อกจาก index.html (กฎข้างล่างส่วนนี้ย้ายมา lots.html) ┄ */
  /* ═════════ v1.4: หน้า HOME · Lot ผลิต (data 6) ═════════
     เดิม: เปิดมาเจอคลังสินค้า (STOCK) ทันที มีหน้าเดียว
     ตอนนี้: เปิดมาที่ HOME เลือกเข้า STOCK หรือ Lot ผลิต · body[data-view] = home | stock | lots (จำใน #hash ของลิงก์) */
  #lotSide{width:256px;flex:none;overflow:auto;padding:12px;border-right:.5px solid var(--line-strong);background:var(--bg2)}
  #lotCenter{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
  #lotDetail{width:380px;flex:none;overflow:auto;border-left:.5px solid var(--line-strong);background:var(--solid);padding:14px 16px 30px}
  #lotBar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:.5px solid var(--line-strong);background:var(--solid);flex-wrap:wrap}
  #lotBar select{border:.5px solid var(--line-strong);border-radius:7px;padding:4px 6px;background:var(--solid);font-size:12px}
  #lotCount{font-size:12.5px;color:var(--ink-dim)} #lotCount b{color:var(--ink);font-size:14px}
  #lotLive{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-dim);white-space:nowrap}
  #lotBanner{margin:8px 12px 0;padding:8px 12px;border-radius:9px;font-size:12.5px;line-height:1.55;background:var(--accent-soft);border:1px solid var(--line)}
  #lotBanner.warn{background:rgba(232,144,31,.14);border-color:rgba(232,144,31,.35)}
  #lotBanner b{color:var(--ink)}
  #lotWrap{flex:1;overflow:auto;position:relative}
  #lotSpacer{width:1px}
  #lotRows{position:absolute;left:0;right:0;top:0}
  .lcols{grid-template-columns:minmax(132px,1.05fr) minmax(200px,2.5fr) 92px 60px 60px 78px 44px 78px 114px 76px 58px 96px 118px}
  .row.lcols{height:44px}
  .row.lcols > .code{font-size:11.5px}
  .m-only{display:none!important}
  #lotDrop{position:absolute;inset:8px;border:2px dashed var(--accent);border-radius:14px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;color:var(--accent);z-index:30;pointer-events:none;text-align:center;padding:20px}
  #lotDetail h2{font-family:var(--mono);font-size:16px;display:flex;align-items:center;gap:8px;word-break:break-all}
  #lotDetail h2 button{margin-left:auto;flex:none}
  #lotDetail .nm1{font-size:14.5px;font-weight:700;margin:6px 0 8px;line-height:1.45}
  @media (max-width: 1500px){
    .lcols{grid-template-columns:minmax(132px,1.05fr) minmax(200px,2.5fr) 92px 60px 60px 78px 78px 114px 76px 58px 96px}
    .c-rq,.c-wk{display:none!important}
  }
  @media (max-width: 1320px){
    #lotDetail{position:fixed;inset:52px 0 0 auto;width:min(420px,100vw);z-index:40;box-shadow:var(--shadow)}
    .lcols{grid-template-columns:minmax(126px,1fr) minmax(190px,2.4fr) 90px 60px 60px 78px 114px 76px 58px 92px}
    .c-pl{display:none!important}
  }
  @media (max-width: 1160px){
    .lcols{grid-template-columns:minmax(120px,1fr) minmax(170px,2.2fr) 88px 58px 58px 78px 76px 90px}
    .c-cr,.c-sh{display:none!important}
  }
  @media (max-width: 980px){
    .lcols{grid-template-columns:minmax(112px,1fr) minmax(150px,2fr) 86px 78px 86px}
    .c-bu,.c-pool,.c-pt{display:none!important}
    .m-only{display:block!important}
    .row.lcols .nm .n1{-webkit-line-clamp:1}
  }
  @media (max-width: 760px){
    #lotSide{position:fixed;inset:52px auto 0 0;z-index:41;width:min(300px,86vw);box-shadow:var(--shadow);transform:translateX(-105%);transition:transform .2s}
    body.sideOpen #lotSide{transform:none}
    .lcols{grid-template-columns:minmax(96px,.9fr) minmax(0,1.6fr) 74px 70px}
    .c-am{display:none!important}
    #lotBar .lbl{display:none}
  }
  @media (min-width: 1701px){
    body.lotDet .lcols{grid-template-columns:minmax(126px,1fr) minmax(190px,2.4fr) 90px 60px 60px 78px 114px 76px 58px 92px}
    body.lotDet .c-rq,body.lotDet .c-wk,body.lotDet .c-pl{display:none!important}
  }
  @media (min-width: 1321px) and (max-width: 1700px){
    body.lotDet .lcols{grid-template-columns:minmax(120px,1fr) minmax(170px,2.2fr) 88px 58px 58px 78px 76px 90px}
    body.lotDet .c-rq,body.lotDet .c-wk,body.lotDet .c-pl,body.lotDet .c-cr,body.lotDet .c-sh{display:none!important}
  }

  /* v1.9 ตัวกรองรายคอลัมน์ (Lot ผลิต) */
  #lotHdr span{position:relative;padding-right:17px}
  #lotHdr .cfb{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:16px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;opacity:0;transition:opacity .12s}
  #lotHdr .cfb svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}
  #lotHdr span:hover .cfb,#lotHdr .cfb:focus{opacity:.75}
  #lotHdr .cfb:hover{opacity:1;background:var(--line)}
  #lotHdr span.fon{color:var(--accent)}
  #lotHdr span.fon .cfb{opacity:1;background:var(--accent);color:#fff}
  #lotHdr span.fon .cfb svg{fill:currentColor}
  @media (hover:none){ #lotHdr .cfb{opacity:.6} }
  #lotCfBar{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:.5px solid var(--line-strong);background:var(--solid);flex-wrap:wrap}
  #lotCfBar .lbl{font-size:11px;font-weight:700;color:var(--ink-faint);letter-spacing:.3px}
  .lcfchips{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}
  .lcfchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;background:var(--accent-soft);color:var(--ink);border:.5px solid var(--line-strong);border-radius:999px;padding:2px 4px 2px 9px;cursor:pointer;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lcfchip b{font-weight:700;color:var(--accent);font-size:11px}
  .lcfchip i{font-style:normal;width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-dim);flex:none}
  .lcfchip i:hover{background:var(--bad);color:#fff}
  .lcfchips a{font-size:11.5px;color:var(--ink-dim);align-self:center;margin-left:2px}
  .lcfpop{position:fixed;z-index:60;background:var(--solid);border:.5px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px;font-size:12.5px;overflow:hidden}
  .lcfpop .h{display:flex;align-items:center;gap:8px}
  .lcfpop .h b{font-size:13px}
  .lcfpop .h .tbtn{margin-left:auto;padding:2px 8px}
  .lcfpop .srt{display:flex;gap:6px}
  .lcfpop .srt .tbtn{flex:1;justify-content:center;font-size:12px;padding:4px 6px}
  .lcfpop .rng{display:flex;gap:6px}
  .lcfpop .rng label{flex:1;display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--ink-dim);min-width:0}
  .lcfpop .rng input{border:.5px solid var(--line-strong);border-radius:7px;padding:4px 6px;background:var(--solid);color:var(--ink);font-size:12px;min-width:0;width:100%}
  .lcfpop input.q{border:.5px solid var(--line-strong);border-radius:8px;padding:6px 9px;background:var(--bg2);color:var(--ink);font-size:12.5px}
  .lcfpop label.all{display:flex;align-items:center;gap:7px;font-weight:700;padding:2px 2px 4px;border-bottom:.5px solid var(--line)}
  .lcfpop .c{margin-left:auto;color:var(--ink-faint);font-family:var(--mono);font-size:11px;font-weight:400}
  .lcfpop .lst{overflow:auto;min-height:60px;max-height:300px;display:flex;flex-direction:column}
  .lcfpop .lst label{display:flex;align-items:center;gap:7px;padding:3px 2px;border-radius:5px;cursor:pointer}
  .lcfpop .lst label:hover{background:var(--bg2)}
  .lcfpop .lst label .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .lcfpop .lst label.emp .v{color:var(--ink-faint);font-style:italic}
  .lcfpop .more{font-size:11px}
  .lcfpop .more:empty{display:none}
  .lcfpop .ft{display:flex;gap:6px;align-items:center;padding-top:6px;border-top:.5px solid var(--line)}
  .lcfpop .ft .sp{flex:1}
  .lcfpop .ft .tbtn{padding:4px 10px;font-size:12px}
</style>
</head>
<body>
<div class="solo">
  <h1>🏭 StarStock · Lot ผลิต</h1>
  <p>ไฟล์นี้เป็นส่วนเสริมของ <b>index.html</b> (หน้า Lot ผลิต) — เปิดตรง ๆ จะไม่มีข้อมูล</p>
  <p>วางไฟล์นี้ไว้โฟลเดอร์เดียวกับ <code>index.html</code> แล้วเปิด <code>index.html#lots</code></p>
  <a class="go" href="index.html#lots">เปิดหน้า Lot ผลิต</a>
</div>
<!-- โครงหน้า: index ใส่ลงใน <div id="lots"> ก่อนรันโค้ด (เดิมอยู่ใน <body> ของ index.html) -->
<template id="sxmHtml">
  <aside id="lotSide"></aside>
  <section id="lotCenter">
    <div id="lotBar">
      <span id="lotCount"></span>
      <span class="sp"></span>
      <span id="lotLive"></span>
      <select id="lotSort" title="เรียงตาม">
        <option value="create:-1">LotCreate ใหม่→เก่า</option>
        <option value="create:1">LotCreate เก่า→ใหม่</option>
        <option value="end:1">enddate ก่อน→หลัง</option>
        <option value="end:-1">enddate หลัง→ก่อน</option>
        <option value="plan:1">แผน45 ก่อน→หลัง</option>
        <option value="plan:-1">แผน45 หลัง→ก่อน</option>
        <option value="stage:1">Stage 0→3</option>
        <option value="stage:-1">Stage 3→0</option>
        <option value="lot:1">LotId A→Z</option>
        <option value="lot:-1">LotId Z→A</option>
        <option value="amount:-1">Amount มาก→น้อย</option>
        <option value="amount:1">Amount น้อย→มาก</option>
        <option value="parts:-1">TotalPart มาก→น้อย</option>
        <option value="parts:1">TotalPart น้อย→มาก</option>
      </select>
      <button class="tbtn" id="lotExp" title="ส่งออกแถวที่กรองอยู่เป็น CSV (เปิดใน Excel ได้)">⬇<span class="lbl"> CSV</span></button>
      <button class="tbtn" id="lotImp" title="นำเข้าไฟล์ CSV จาก BI ขึ้น Google Drive — ทุกเครื่องเห็นภายใน 30 วิ">⬆<span class="lbl"> นำเข้า CSV</span></button>
      <input type="file" id="lotFile" accept=".csv,.txt,.tsv,text/csv" class="hide">
    </div>
    <div id="lotBanner" class="hide"></div>
    <div id="lotWrap">
      <div id="lotHdr" class="hdr lcols"></div>
      <div id="lotSpacer"></div>
      <div id="lotRows"></div>
    </div>
    <div id="lotDrop" class="hide">วางไฟล์ CSV (data 6) ตรงนี้<br>เพื่อส่งขึ้น Google Drive ให้ทุกเครื่องเห็น</div>
  </section>
  <aside id="lotDetail" class="hide"></aside>
</template>
<script id="sxmJs" type="text/x-starstock">
/* ═══════════════════════════════════════════════════════════════════════
   StarStock · หน้า Lot ผลิต — โค้ด (index.html รันส่วนนี้ด้วย sxmEval = อยู่ในสโคปเดียวกับโค้ดของ index · โหมด strict)
   ประวัติ v1.4–v2.45 ของแต่ละส่วน = คอมเมนต์หัวบล็อกเดิม (ยกมาจาก index.html ทั้งหมด)
   ═══════════════════════════════════════════════════════════════════════ */
var LOTS_VER = '1.0';
/* ชื่อใน index.html ที่โค้ดนี้ใช้ (ตัวแปร/ฟังก์ชันของ StarStock) — ตรวจตอนโหลด: index ไม่มีตัวไหน = เตือนใน console + ข้อความมุมจอ
