/* ═════════ Lot ผลิต: หน้าจอ ═════════ */
function lotShow() {
  if (!$('lq')) lotRenderSide();
  lotRenderFresh(); lotBanner(); lotRefresh(false);
  if (ensureFs()) lotLoad({ quiet: L.loaded });
}
function lotRenderFresh() {
  var e = $('lotFresh'), s = lotSrcTxt(), ago = function (t) { var m = Math.round((Date.now() - t) / 1000); return m < 60 ? m + ' วิที่แล้ว' : durTh(m / 60) + 'ที่แล้ว'; };   // v1.7.1 เกินชั่วโมง = ชม. + นาที
  if (e) { e.textContent = L.none ? 'data 6 · ยังไม่มีไฟล์บน Drive' : L.loaded ? 'data 6 · ' + L.rows.length.toLocaleString('th-TH') + ' แถว' + (s.at ? ' · อัปเดต ' + s.short : '') + (s.src ? ' · ' + s.src : '') : 'กำลังอ่าน data 6…';
    if (s.checked) e.title = 'StarSync ตรวจ AX ล่าสุด ' + s.checked + ' (ข้อมูลไม่เปลี่ยนตั้งแต่ ' + s.short + ')';
    e.classList.toggle('warn', !!L.err); }   /* lots 1.49 ผู้ใช้ 20:24 “เอาคำเตือนออก” — เดิม: || (!s.imp && s.age != null && s.age > 40) = StarSync ไม่ส่งเกิน 40 นาทีก็เป็นสีส้ม */
  var lv = $('lotLive');
  if (lv) lv.innerHTML = '<span class="live' + (L.err ? ' bad' : '') + '"></span><span class="lbl">' + (L.err ? 'ติดต่อ Drive ไม่ได้ — ลองใหม่เอง' : 'อัปเดตเองทุก 30 วิ') + (L.lastCheck ? ' · ตรวจ ' + ago(L.lastCheck) : '') + '</span>';
}
function lotBanner() {
  var bn = $('lotBanner'), s = lotSrcTxt(); if (!bn) return;
  var h = '', warn = false;
  if (L.err && L.rows.length) { h = '<b>อ่าน data 6 จาก Google Drive ไม่ได้</b> — ' + esc(netMsg(L.err)) + ' · ใช้ข้อมูลเดิมไปก่อน จะลองใหม่เองทุก 30 วิ'; warn = true; }
  else if (L.err) { h = '<b>อ่าน data 6 จาก Google Drive ไม่ได้</b> — ' + esc(netMsg(L.err)) + ' · <a href="#" data-act="retry">ลองเลย</a>'; warn = true; }
  else if (L.loaded && !L.none && s.imp) h = '<b>ข้อมูลชุดนี้นำเข้าจากไฟล์ CSV</b>' + (L.meta && L.meta.file ? ' (' + esc(L.meta.file) + ')' : '') + (L.meta && L.meta.by ? ' โดย ' + esc(L.meta.by) : '') + (s.at ? ' เมื่อ ' + esc(s.short) : '')
    + ' — ยังไม่ได้ดึงจาก AX อัตโนมัติ · ตารางเปลี่ยนเมื่อมีคนนำเข้าไฟล์ใหม่ หรือเมื่อ StarSync เริ่มส่ง (sync-ax-lots.ps1 + lots.sql)';
  else if (false /* lots 1.49 ผู้ใช้ 20:24 “เอาคำเตือนออกทีครับ” — เดิม: L.loaded && !L.none && s.age != null && s.age > 40 (StarSync ไม่ส่งเกิน 40 นาที = แถบส้ม) */) { h = '<b>StarSync ไม่ได้ส่งข้อมูล Lot มา ' + durTh(s.age) + 'แล้ว</b> — ดูหน้าต่าง StarSync ที่เครื่องออฟฟิศ (ปกติส่งทุก 10 นาทีเมื่อมีอะไรเปลี่ยน)'; warn = s.age > 120; }
  /* v1.7: ข้อมูลจาก AX — บอกว่าช่องที่ AX ไม่มีเติมจาก BI ได้กี่ Lot */
  if (false /* lots 1.79 ผู้ใช้ 13:53 “เอาคำบอกด้านบนออกด้วย” — เดิม: */ && !h && L.loaded && !L.none && L.meta && /StarSync/i.test(L.meta.src || ''))
    h = '<b>ข้อมูลจาก AX (StarSync ทุก 10 นาที)</b> · ' + (L.bi ? 'Bu · Amount · แผน45 เติมจากไฟล์ BI ที่นำเข้าไว้ ' + L.biUsed.toLocaleString('th-TH') + ' Lot · Lot ที่ไม่มีในไฟล์ BI ช่องพวกนี้ว่าง (นำเข้าไฟล์ใหม่เมื่อไหร่ก็เติมให้)'
      : 'ช่อง Bu · Amount · แผน45 · ReqBom · PeConfirm ไม่มีใน AX — ลากไฟล์ data 6 จาก BI มาวางเพื่อเติม (ไม่ทับตาราง)');
  bn.classList.toggle('hide', !h); bn.classList.toggle('warn', warn); bn.innerHTML = h;
}
function lotSeg(key, opts) { return '<div class="seg">' + opts.map(function (o) { return '<button data-lseg="' + key + '" data-v="' + o[0] + '" class="' + (L.f[key] === o[0] ? 'on' : '') + '"' + (o[2] ? ' title="' + esc(o[2]) + '"' : '') /* lots 1.34 คำอธิบายรายปุ่ม */ + '>' + esc(o[1]) + '<span class="c" data-lc="' + key + ':' + o[0] + '"></span></button>'; }).join('') + '</div>'; }
function lotRenderSide() {
  var h = '<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="lq" type="search" placeholder="ค้นหา Lot / remark / Code Part" title="ค้นหา LotId · remark · Shelf · Bu · pool · Code Part / Code Pack / Barcode (เต็มหรือบางส่วน · ยิงสติกเกอร์ลงช่องนี้ได้)" value="' + esc(L.f.q) + '" autocomplete="off"></div>';

  /* lots 1.13 (ผู้ใช้ 11:23 “เพิ่มให้ตรงนี้ มีกรอง Lot ที่กำลัง Part Edge Drill Pack Pick อื่น ๆ”): สถานะของ Lot = ขั้นที่ช้าสุดที่ยังมีชิ้นค้าง (pstLotCur) */
  h += '<div class="fgrp"><h4 title="ขั้นที่ Lot อยู่ตอนนี้ = ขั้นที่ช้าสุดที่ยังมีชิ้นค้าง (ตัวเดียวกับกล่องสถานะในแท็บสถานะ Part) · ไม่มีข้อมูล = Lot ที่ไม่มีรายชิ้นในไฟล์ของ StarSync (enddate นอกช่วง)">สถานะ</h4>'
    + lotSeg('pst', [['all', 'ทั้งหมด']].concat(PST_LCUT, PST_STEPS.slice(1).map(function (S0, i) { return [String(i + 1), pstStepNm(S0)]; }), [[String(PST_DONE), 'ครบ'], ['none', 'ไม่มีข้อมูล']]))   /* lots 1.34: Part/ตัด → กำลังตัด · รอตัด */.replace('<div class="seg">', '<div class="seg pstseg">') + '</div>';
  /* lots 1.75 (ผู้ใช้ 13:22 “เพิ่มกรองประเภทด้วย”): ประเภทงานของ Lot (ป้ายเดียวกับหน้าเลือก Lot · Lot หนึ่งมีได้หลายประเภท) */
  h += '<div class="fgrp"><h4 title="ประเภทงานของ Lot — ป้ายเดียวกับช่องประเภทงานในหน้าเลือก Lot · Lot ที่มีหลายประเภทอยู่ได้หลายปุ่ม · ไม่มีข้อมูล = ยังไม่มีรายชิ้น/FrontStyle/ใบปิดผิว">ประเภทงาน</h4>'
    + lotSeg('pty', PST_PTY_OPTS).replace('<div class="seg">', '<div class="seg pstseg">') + '</div>';
  var wk = weekNow();

  h += '<div class="fgrp"><h4>Bu</h4><div class="flist" id="lfBu"></div></div>';
  h += '<div class="fgrp"><h4>prodpoolid</h4><div class="flist" id="lfPool"></div></div>';
  h += '<div class="fgrp"><button class="tbtn" id="lfClear" style="width:100%;justify-content:center">ล้างตัวกรองทั้งหมด</button></div>';

  $('lotSide').innerHTML = h;
  var qi = $('lq'); qi.oninput = function () { clearTimeout(qi._t); qi._t = setTimeout(function () { L.f.q = qi.value; lotRefresh(true); }, PST_TYPE_MS); };   // lots 1.39 รอหยุดพิมพ์ 1 วิ (เดิม 0.12)
