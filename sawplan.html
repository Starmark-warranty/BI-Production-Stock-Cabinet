function buildDD(){
  var list=document.getElementById("ddList");
  var q=ddQ.toLowerCase();
  list.innerHTML="";
  A.filter(function(d){return !q||d.id.toLowerCase().indexOf(q)>=0;}).forEach(function(d){
    var chk=selLots.size===0||selLots.has(d.id);
    var el=document.createElement("label");
    el.className="dd-item"+(chk?" on":"");
    var cb=document.createElement("input");
    cb.type="checkbox"; cb.checked=chk; cb.dataset.id=d.id;
    var sp=document.createElement("span"); sp.textContent=d.id;
    el.appendChild(cb); el.appendChild(sp); list.appendChild(el);
  });
}
function openDD(){
  ddOpen=!ddOpen;

}
function ddAll(){selLots.clear();document.querySelectorAll("#ddList input").forEach(function(c){c.checked=true;c.closest(".dd-item").classList.add("on");});updDdBtn();render();}

}
function pdAll(){
  selPools.clear();

function pdClr(){
  selPools.clear();

function updPdBtn(){
  var b=document.getElementById("pdBtn");
  if(!b)return;
  var total=document.querySelectorAll("#pdList input[type=checkbox]").length;
  var chk=document.querySelectorAll("#pdList input[type=checkbox]:checked").length;
  var txt=b.querySelector(".pd-txt");
  if(txt)txt.textContent=(chk===0||chk===total)?"🏭 ทุก Pool":"🏭 Pool ("+chk+")";
  b.classList.toggle("on",chk>0&&chk<total);
}

document.addEventListener("click",function(ev){
  if(!ev.target.closest(".dd-wrap")&&ddOpen){
    ddOpen=false;
    document.getElementById("ddPanel").classList.remove("show");
    document.getElementById("ddBtn").classList.remove("on");
  }
  if(!ev.target.closest(".pd-wrap")&&pdOpen){
    pdOpen=false;
    document.getElementById("pdPanel").classList.remove("show");
    document.getElementById("pdBtn").classList.remove("on");
  }
  var hd=ev.target.closest(".lot-hd");
  if(hd&&hd.dataset.uid){
    var uid=hd.dataset.uid;
    var bd=document.getElementById("b_"+uid);
    var cv=document.getElementById("c_"+uid);
    if(bd){var op=bd.classList.toggle("open");if(cv)cv.style.transform=op?"rotate(90deg)":"";}
  }
  var cb=ev.target.closest(".dd-item input[type=checkbox]");
  if(cb){
    ev.stopPropagation();
    var id2=cb.dataset.id;
    if(!id2)return;
    if(cb.checked){selLots.add(id2);cb.closest(".dd-item").classList.add("on");}
    else{selLots.delete(id2);cb.closest(".dd-item").classList.remove("on");}
    updDdBtn();render();
  }
  var pcb=ev.target.closest(".pd-item input[type=checkbox]");
  if(pcb){
    ev.stopPropagation();
    var pp2=pcb.dataset.pool;
    if(!pp2)return;
    if(pcb.checked)selPools.delete(pp2);else selPools.add(pp2);
    pcb.closest(".pd-item").classList.toggle("on",pcb.checked);
    updPdBtn();render();
  }
});
document.addEventListener("change",function(ev){

});

}

/* ───────────── 8. เลือก / ลงเครื่อง / เอาออก (มีด่านถามก่อน) ───────────── */

   - แผนวันที่ผ่านมาแล้ว (เปิดค้างข้ามคืน / เลือกวันย้อนหลัง) → ถามก่อน */
function addSelection(keys, srcLabel, opt){

  keys = keys.filter(ok);

  /* v1.6.7: ยอดแผ่นที่ตั้งไว้ก่อนติ๊ก (✎ แก้ยอดชั้นไม้ที่ยังไม่อยู่ในแผน) — เปลี่ยนวัน / แท็บอื่นบันทึกระหว่างหน้าต่างถาม ล้าง PL.n → ใส่คืน (เดิมได้ทั้งชั้นไม้) */

}

};

  /* v1.63 วันข้างหน้า: Lot ที่ StarStock ย้ายวันแล้ว (แผน StarStock เปลี่ยน) = จัดใหม่ต่อกันทุกวัน (sxCascade) — เดิมแค่เติมที่ยังไม่ลง แผนเก่าค้าง · v1.64 ตรวจทุกวัน + เครื่อง (sxAutoSync) */
  try { var sy0 = sxAutoSync(why); if (sy0) return sy0; } catch (e) { if (window.console) console.error('[SAWPLAN] v1.64 auto', e); }   /* v1.64 ทุกวัน (รวมวันนี้) ตรงกับ StarStock ทั้งวัน + เครื่อง */
  SP.autoBusy = true;
  try {
    var grp = SXS.grpLoad ? SXS.grpLoad() : null, r = SP.autoStar ? SP.autoStar(grp, { quiet: 1 }) : null;
    if (!r) { undoMark('🤖 Auto จัดลงเครื่อง'); r = autoPlan({ grp: grp }); PL.ack = false; UI.expTouched = false; refreshAll(); }
    if (r.err) { toast('🤖 Auto: ' + esc(r.err), 'warn', 5000); return r; }
    var n = (r.placed ? r.placed.length : 0) + (r.star && r.star.n ? r.star.n : 0), f = r.failed ? r.failed.length : 0;
    SP.autoLast = { why: why, date: PL.date, n: n, f: f, at: Date.now() };
    if (n || f || why === 'on') toast('🤖 Auto' + (why === 'date' ? ' (' + esc(dShort(PL.date)) + ')' : '') + ': ' + (n || f ? 'ลงเครื่องเพิ่ม ' + n + ' ชั้นไม้' : 'ไม่มีชั้นไม้ให้ลงเพิ่ม (ลงครบแล้ว / Lot ยังไม่มี .saw)') + (f ? ' · ยังลงไม่ได้ ' + f + ' ชั้นไม้ (ดู “ยังไม่ได้ลงเครื่อง”)' : '') + (n && UNDO ? ' · ↩ ย้อนกลับได้' : ''), f ? 'warn' : 'ok', 5000);   // ไม่มีอะไรเปลี่ยน = ไม่ต้องขึ้นข้อความทุกครั้งที่เข้าแท็บ
    return r;
  } catch (e) { if (window.console) console.error('[SAWPLAN] auto', e); return null; }
  finally { SP.autoBusy = false; }
};

function planText(){
  var L = loads(), out = ['📅 แผนตัดวันที่ ' + dateTH(PL.date) + (weekTitle() ? ' · ' + weekTitle() : '')], tot = 0, cap = 0, nJob = 0;
  MS.machines.forEach(function(m){
    var x = L[m.id]; if (!x.n && !x.extN) return; nJob++; tot += x.sec; if (mOn(m)) cap += x.cap;
    out.push('');
    out.push('🏭 ' + m.name + ' · ' + hms(x.sec) + ' / ' + m1(x.cap).replace(/\.0$/, '') + ' นาที (' + (x.cap > 0 ? Math.round(x.pct) + '%' : '—') + ')' + (x.st === 'over' ? ' ⚠ เกิน ' + m1(x.sec - x.cap) + ' นาที' : ''));
    out.push('   ' + x.n + ' ชั้นไม้ · ' + x.nLots + ' Lot · ' + n0(x.q) + ' แผ่น' + (x.parts ? ' · ' + n0(x.parts) + (x.pUnk ? '+' : '') + ' ชิ้น' : '') + (x.nPart ? ' · ✂ ตัดบางแผ่น ' + x.nPart : ''));
    var g = lotGroups(cutOrder(x.keys));
    g.slice(0, 15).forEach(function(o){ out.push('   • ' + o.lot + (o.saw ? ' (' + o.saw.replace(/\.saw$/, '') + ')' : '') + ' · ' + o.n + ' ชั้นไม้'); });
    if (g.length > 15) out.push('   • … อีก ' + (g.length - 15) + ' Lot');
    if (x.extN) out.push('   • + งานจากไฟล์ SAW อื่น ' + x.extN + ' ชั้นไม้ (' + hms(x.extSec) + ')');
  });
  if (!nJob) out.push('', '(ยังไม่มีชั้นไม้ลงเครื่อง)');
  else out.push('', 'รวม ' + nJob + ' เครื่อง · ' + hms(tot) + (cap ? ' / ' + m1(cap).replace(/\.0$/, '') + ' นาที' : ''));

  return out.join('\n');
}

function cfgSnap(withPlan){
  var o = { m: clone(MS.machines), skip: MS.skip, sets: clone(PS.sets), basis: clone(PS.basis), edit: PS.edit, over: {} };
  if (withPlan) o.pl = { sel: clone(PL.sel), asg: clone(PL.asg), why: clone(PL.why), target: PL.target };
  var L = loads(); MS.machines.forEach(function(m){ var x = L[m.id]; if (x.st === 'over') o.over[m.id] = x.sec - x.cap; });
  return o;
}
function cfgRestore(o){
  MS.machines = clone(o.m); MS.skip = o.skip; PS.sets = clone(o.sets); PS.basis = clone(o.basis); PS.edit = setById(o.edit) ? o.edit : 'std';
  if (o.bk) {                                                              // งานวันอื่นของเครื่องที่ถูกเอาออก (คืนค่ามาตรฐาน) → ลงเครื่องเดิมกลับ (ถ้ายังไม่มีใครแก้)
    var fresh = LS_OK ? bookRead() : clone(BOOK), me = syCid(), now = Date.now(), nb = 0;
    Object.keys(o.bk).forEach(function(sk){ var e = fresh[sk], x = o.bk[sk]; if (!e || e[0] !== x[0] || e[1]) return; var y = x.slice(); y[5] = Math.max(now, jAt(e) + 1); y[6] = me; fresh[sk] = y; nb++; });

  }

  ghostSync(); if (o.pl) savePlan();                                       // เครื่องที่กลับมา → งานลงเครื่องตามเดิม
  saveMachines(); saveParams(); bumpTimes();

function loadStoredImports(){

    var n = 0;
    all.sort(function(a, b){ return (a.kind === 'csv' ? 0 : 1) - (b.kind === 'csv' ? 0 : 1); });   // CSV ก่อน แล้ว .xlsx (CutRite) ทับ
    all.forEach(function(rec){
      if (rec.kind === 'csv') { var Lc = lotByName(rec.lot); if (Lc && applyCsvRec(Lc, rec).ok) n++; return; }
      var Lt = null;
      for (var i = 0; i < LOTS.length; i++) { var d = LOTS[i].d; if ((String(d.xf || ('id:' + d.id)) === rec.xf) && d.id === rec.lot) { Lt = LOTS[i]; break; } }
      if (!Lt || Lt.items.every(function(it){ return it.src === 'file'; })) return;
      var a = applyRec(Lt, rec, 'xlsx'); if (a.ok) n++;
    });
    if (n) { bumpTimes(); refreshAll(); }
    return n;
  }).catch(function(){ return 0; });
}
